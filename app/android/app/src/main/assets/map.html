<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>天地图</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#181410; overflow:hidden;
    font-family:sans-serif; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #map { position:absolute; inset:0; overflow:hidden; touch-action:none; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:none; }
  .tile { position:absolute; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #controls { position:absolute; left:10px; top:10px; z-index:10; }
  #controls button { display:block; width:92px; margin-bottom:5px; padding:7px 4px; background:#201a14;
    color:#dcbe82; border:1px solid #5a4a30; border-radius:6px; font-size:13px; }
  #controls button.active { background:#5a4a30; color:#fff; }
  #pitchWrap { display:none; margin:0 0 5px 0; width:92px; }
  #pitchWrap input { width:92px; }
  #hint { position:absolute; left:10px; bottom:10px; color:#968268; font-size:11px; z-index:10; max-width:74%; }
  #hud { position:absolute; right:10px; top:10px; z-index:10; color:#dcbe82; font-size:12px; line-height:1.55;
    background:#201a14cc; border:1px solid #5a4a30; border-radius:6px; padding:5px 8px;
    white-space:pre; display:none; }
  #needle { position:absolute; left:50%; top:50%; width:2px; height:34vw; max-height:140px;
    margin-left:-1px; margin-top:-34vw; background:linear-gradient(180deg,#ff4444,transparent);
    transform-origin:50% 100%; z-index:6; pointer-events:none; }
  #heading-label { position:absolute; left:50%; top:8px; transform:translateX(-50%);
    color:#ff6666; font-size:13px; z-index:6; background:#201a14cc; padding:2px 8px; border-radius:6px; }
  .marker { position:absolute; width:14px; height:14px; margin:-7px; border-radius:50%;
    background:#ff4444; border:2px solid #fff; z-index:7; pointer-events:none; box-shadow:0 0 4px #000; }
  /* F-06/F-07 点标叠加：名称标签（可直接点选） */
  .ovlabel { position:absolute; max-width:120px; padding:2px 6px; background:#201a14cc; color:#f0e0bc;
    border:1px solid #8a6a3a; border-radius:5px; font-size:11px; white-space:nowrap;
    pointer-events:auto; cursor:pointer; }
  /* F-14 钓点：圆形水滴 + 单字（库=橙 / 河=蓝 / 塘=紫 / 黑=黑坑深灰），下方跟地名 */
  .fish { position:absolute; width:22px; height:22px; border-radius:50% 50% 50% 0;
    transform:translate(-50%,-100%) rotate(-45deg); border:2px solid #fff;
    box-shadow:0 1px 4px #0009; pointer-events:auto; cursor:pointer; z-index:9; }
  .fish span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    transform:rotate(45deg); font-size:11px; color:#fff; font-weight:bold; }
  .fish-label { position:absolute; transform:translate(-50%,0); font-size:10px; color:#fff;
    text-shadow:0 1px 2px #000,0 0 3px #000; white-space:nowrap; pointer-events:none; z-index:9; }
  #fsExit { position:fixed; right:10px; bottom:70px; z-index:30; display:none; padding:9px 14px;
    background:#201a14e6; color:#dcbe82; border:1px solid #5a4a30; border-radius:8px; font-size:14px; }
  #srcInfo { position:absolute; right:10px; bottom:8px; z-index:9; color:#968268; font-size:11px;
    background:#201a14cc; padding:2px 6px; border-radius:5px; pointer-events:none; }
  #hint, #hud, #heading-label, #srcInfo { pointer-events:none; }
  /* R2-027 返工：面板只占中间地图带（左右各让出 60 CSS px ≈ 202 设备 px），
     不再压住左右工具列，也不截走工具列的点击。364 CSS px 宽视口下中带 ≈ 244 px。 */
  #srcPanel { position:absolute; left:60px; right:60px; top:0; bottom:0;
    background:#00000099; z-index:20; display:none; }
  #srcPanel .box { position:absolute; left:0; right:0; top:70px; max-height:72%; overflow:auto;
    background:#201a14f5; border:1px solid #5a4a30; border-radius:10px; padding:8px; }
  #srcPanel h3 { margin:2px 0 6px 2px; color:#dcbe82; font-size:14px; }
  #srcPanel .srchint { color:#968268; font-size:10px; margin:0 0 6px 2px; line-height:1.3; }
  .srcItem { display:block; width:100%; text-align:left; padding:9px 10px; margin-bottom:5px;
    background:#2a231b; color:#dcbe82; border:1px solid #4a3c28; border-radius:6px; font-size:13px; }
  .srcItem.off { color:#6b5f4d; border-color:#3a3126; }
  .srcItem.on { background:#5a4a30; color:#fff; }
  /* R2-027：12 格缩略图网格（3 列 × 4 行）+ 「自定义源」（+），源名在卡片底部 */
  #srcBox { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; }
  .srcCard { display:flex; flex-direction:column; padding:0; overflow:hidden; width:100%;
    background:#2a231b; color:#dcbe82; border:1px solid #4a3c28; border-radius:8px; }
  .srcCard.off { color:#6b5f4d; border-color:#3a3126; }
  .srcCard.on { border-color:#dcbe82; box-shadow:0 0 0 1px #dcbe82 inset; }
  .srcThumb { height:46px; width:100%; display:block; object-fit:cover; background:#241e17; }
  .srcCard.off .srcThumb { filter:grayscale(1) brightness(.55); }
  .srcNoThumb { height:46px; display:flex; align-items:center; justify-content:center;
    background:linear-gradient(135deg,#241f19,#1b1712); color:#5d5347; font-size:9px; }
  .srcName { padding:4px 3px 5px; font-size:9px; line-height:1.2; text-align:center;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
</style>
</head>
<body>
<div id="map">
  <canvas id="gl"></canvas>
</div>
<div id="controls">
  <button id="btn_vec" onclick="setBase('vec')">矢量</button>
  <button id="btn_img" onclick="setBase('img')">影像</button>
  <button id="btn_ter" class="active" onclick="setBase('ter')">地形</button>
  <button id="btn_3d" onclick="toggle3D()">3D 地形</button>
  <button onclick="rotateBearing(-15)">⟲ 旋转</button>
  <button onclick="rotateBearing(15)">⟳ 旋转</button>
  <button onclick="zoomIn()">放大 +</button>
  <button onclick="zoomOut()">缩小 −</button>
  <button onclick="pitchStep(-10)">俯仰 −</button>
  <button onclick="pitchStep(10)">俯仰 +</button>
  <div id="pitchWrap"><input id="pitchRange" type="range" min="0" max="60" step="1" value="45" oninput="setPitch(this.value)"></div>
  <button onclick="openSources()">底图源</button>
  <button id="btn_road" onclick="toggleRoadNet()">路网视图</button>
  <button id="btn_ridge" onclick="toggleRidge()">山脊</button>
  <button id="btn_needle" class="active" onclick="toggleNeedle()">指针</button>
  <button id="btn_sit" onclick="toggleSitNorth()">坐南朝北</button>
  <button id="btn_contour" onclick="toggleContour()">等高线</button>
  <button id="btn_ground" onclick="toggleGround()">贴地</button>
  <button onclick="toggleFullScreen()">全屏</button>
  <button onclick="clearMarkers()">清除标记</button>
  <button onclick="locate()">定位</button>
</div>
<div id="hud"></div>
<button id="fsExit" onclick="toggleFullScreen()">退出全屏</button>
<div id="srcInfo">数据来自天地图地形（等价替代原版世纪空间）· 审图号：未确认</div>
<div id="srcPanel"><div class="box"><h3>底图源</h3>
  <div class="srchint">原版 12 源；无 key 的置灰（D-006），审图号须按源官方核对</div>
  <div id="srcBox"></div>
  <button class="srcItem" onclick="closeSources()">关闭</button>
</div></div>
<div id="hint">天地图 · 拖动平移，按钮缩放 · 罗盘指针显示坐向</div>
<div id="needle"></div>
<div id="heading-label">向 0°</div>

<script>
/* ============================================================
 * 山水罗盘 · map.html
 * 2D：天地图 WMTS 瓦片（原逻辑保留）
 * 3D：WebGL 真高程地形（DEM = AWS Terrain Tiles / Terrarium）
 *     + 天地图底图贴面 + 俯仰 0–60° + 旋转 + 罗盘坐向指针
 * 桥接口：见 docs/map-bridge.md
 * ============================================================ */

/* ---------------- 公共状态 ---------------- */
/* 天地图**网页端 key**：绝不进仓库（仓库是 public）。由原生侧加载本页时用 query 参数传入：
 *   file:///android_asset/map.html?tk=<webKey>#in3d&measure=area
 * 注意 query 与 hash 的顺序——hash 必须在 `?tk=` 之后，原有的 `#in3d&measure=…` 语义不变。
 * 取不到就置空 + 一条明确警告，**不回退到任何硬编码 key**（回退等于又把 key 提交进 git）。 */
var KEY = (function () {
  try {
    var q = location.search || "";
    if (typeof URLSearchParams === "function") {
      var v = new URLSearchParams(q).get("tk");
      return v ? String(v) : "";
    }
    var m = q.match(/[?&]tk=([^&#]*)/);          /* 老 WebView 兜底 */
    return m ? decodeURIComponent(m[1]) : "";
  } catch (e) { return ""; }
})();
if (!KEY) {
  console.warn("LC3D WARN 未收到天地图网页端 key（加载地址需带 ?tk=…），底图瓦片将无法加载；"
    + "这是预期行为——仓库内不保存任何 key。");
}
var SUB = ["t0","t1","t2","t3","t4","t5","t6","t7"];
var base = "ter";              // vec=矢量 img=影像 ter=地形(默认)
var anno = "cta";              // 注记层
var roadNet = false;           // F-04 路网视图：vec 路网图面 + cva 路名注记（无实时路况）
var baseBeforeRoad = null;     // 进入路网视图前的底图，关闭时恢复
var ridgeOn = false;           // F-06 山脊：DEM 曲率派生高亮（非官方山脉边界）
var ovKind = "", ovPoints = [], ovEls = [], ovLayer = null;   // F-06/F-07 点标叠加
var wbOn = false;              // F-10 历史影像：Esri Wayback 近似（Google 历年影像不可得）
var wbRelease = "";            // Wayback 释放号（来自 waybackconfig.json）
var baseBeforeWb = null;       // 进入历史影像前的底图
/* F-02 瓦片内存缓存：命中时用 dataURL，不再走网络（Java 侧拼接还有磁盘缓存） */
var tileCacheOn = false, tileCache = {}, tileCacheKeys = [], TILE_CACHE_MAX = 160;

/* MD-09：桥入参条数上限（防调试注入通道/异常数据把 DOM 撑爆）。
 * 超限按**先到先留**截断，并在对应事件里回传 dropped（被丢掉的条数），客户端可据此提示。 */
var LIMIT_OVERLAY_POINTS = 2000;   // 单层点标（setOverlay / setOverlayLayer）
var LIMIT_FISH_POINTS = 500;       // 钓点图层
var LIMIT_TRACK_POINTS = 20000;    // 轨迹总点数
var LIMIT_TRACK_SEGMENTS = 200;    // 轨迹段数
/* F-12 测量 / F-13 画笔 */
var measure = { on: false, area: false, pts: [] };
var paint = { on: false, color: "#ff5500", width: 4, strokes: [], cur: null };
var ovSvgEl = null;
/* F-14 钓点图层 / F-03 海拔查询 */
var fish = { on: false, items: [], els: [] };
var fishLayerEl = null;
var elevQuery = { on: false };
/* F-05 叠加：多图层，id 独立开关 + 每层透明度 */
var ovLayers = {};              // id -> {id,on,opacity,items,els,container}
var ovLayersEl = null;
/* F-15 轨迹回放（客户端做记录/列表/详情，这里只做桥与渲染） */
var track = {
  loaded: false, segments: [], t0: 0, t1: 0, t: 0,
  playing: false, rate: 2, follow: true, raf: 0, lastTs: 0, lastEmit: 0, lastDraw: 0
};
var trackSvgEl = null;
var trackCursorEl = null;      /* MD-05：光标是一个复用的 circle，逐帧只改 cx/cy */
var mode = "2d";               // 2d | 3d
var bearing = 0;               // 地图旋转角
var pitch = 45;                // 3D 俯仰 0(俯视)–60°
var center = { lat: 39.9042, lng: 116.4074 };   // 北京
var zoom = 5;
var lastHeading = 0;
var needleOn = true;           // 指针开关（原版右侧「指针开关」）
/* 坐向对齐（原版 F5：单按钮双标签，g.x() 布尔驱动文案）
 * 0=关 1=坐南朝北(向朝上, bearing=heading) 2=坐北朝南(坐朝上, bearing=heading+180)
 * 第二态几何为等价替代，原版未取证 */
var sitMode = 0;
var bearingBeforeSit = 0;
var contourOn = false;         // 等高线（3D 高程着色叠加）
var groundMode = false;        // 贴地：低机位 + 高俯仰
var pitchBeforeGround = 45;
var drape = "img";             // 3D 贴面层（D-005：默认影像；ter 仍可用按钮切）
var pick = null;               // 3D 立向点 {lng,lat,elev,world,heading}
var pickEl = null;
var lastVP = null, lastD = 0, lastR = 0;
/* K-01：单页 UI 模式。full=现状（保留 #controls 等，供无头 AT/回退）；
 * map=原生左/右工具列接管，隐藏 map 自带 chrome，地图仍可拖动缩放；
 * compass=在 map 基础上再隐藏 #needle（罗盘浮层自绘准星/北针）。 */
var uiMode = "full";

var mapEl = document.getElementById("map");
var glCanvas = document.getElementById("gl");
var hudEl = document.getElementById("hud");
var baseLayer = document.createElement("div");
var annoLayer = document.createElement("div");
baseLayer.style.position = "absolute";
annoLayer.style.position = "absolute";
mapEl.appendChild(baseLayer);
mapEl.appendChild(annoLayer);

/* MD-11：Wayback 释放号来自外部 waybackconfig.json，只接受纯数字白名单（实测 198 个时相都是
 * 5 位数字，如 43291/63116/26334）。非法的直接退回默认时相，绝不原样拼进 URL/HTML 属性。 */
var WB_RELEASE_RE = /^\d{1,8}$/;
var WB_DEFAULT_RELEASE = "43291";        /* 实测时相之一（2026-10-29 那一期） */

function wbSafeRelease(r) {
  var s = String(r == null ? "" : r).trim();
  return WB_RELEASE_RE.test(s) ? s : WB_DEFAULT_RELEASE;
}

/* ---------------- 2D 瓦片 ---------------- */
function tileUrl(layer, z, x, y) {
  if (layer === "wayback") {
    /* F-10：Esri Wayback 历史影像（释放号来自 waybackconfig.json，见 docs/features/map-free-sources.md）。
     * 来源/许可：Esri, Maxar, Earthstar Geographics 等；仅自用展示，页面/客户端需标注来源。 */
    var rel = wbSafeRelease(wbRelease);
    return "https://wayback.maptiles.arcgis.com/arcgis/rest/services/World_Imagery/WMTS/1.0.0"
      + "/default028mm/MapServer/tile/" + encodeURIComponent(rel) + "/" + z + "/" + y + "/" + x;
  }
  var s = SUB[(((x + y) % 8) + 8) % 8];
  if (!KEY) return "";                    /* 没 key 就不拼带空 tk 的请求（填图时直接跳过） */
  return "https://" + s + ".tianditu.gov.cn/" + layer + "_w/wmts" +
    "?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=" + layer +
    "&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles" +
    "&TILEMATRIX=" + z + "&TILEROW=" + y + "&TILECOL=" + x + "&tk=" + KEY;
}

function lonLatToTile(lng, lat, z) {
  var n = Math.pow(2, z);
  var x = (lng + 180) / 360 * n;
  var latRad = lat * Math.PI / 180;
  var y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return { x: x, y: y };
}

function tileYToLat(y, z) {
  var n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(Math.sinh(n));
}

function render() {
  if (mode === "3d") return;
  var n = Math.pow(2, zoom);
  var c = lonLatToTile(center.lng, center.lat, zoom);
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  var tx = c.x * 256 - w / 2;
  var ty = c.y * 256 - h / 2;
  var x0 = Math.floor(tx / 256), x1 = Math.ceil((tx + w) / 256);
  var y0 = Math.floor(ty / 256), y1 = Math.ceil((ty + h) / 256);

  fillLayer(baseLayer, base, x0, x1, y0, y1, tx, ty, n);
  fillLayer(annoLayer, anno, x0, x1, y0, y1, tx, ty, n);
  updateOverlay(null);
  updateFish(null);
  updateOverlayLayers();
  updateTrack();
  renderOverlays();
}

function fillLayer(layerEl, layer, x0, x1, y0, y1, tx, ty, n) {
  if (!layer) { layerEl.innerHTML = ""; return; }
  var html = "";
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var xx = x, yy = y;
      xx = ((x % n) + n) % n;
      if (yy < 0 || yy >= n) continue;
      var left = x * 256 - tx;
      var top = y * 256 - ty;
      var url = tileUrl(layer, zoom, xx, yy);
      if (!url) continue;                 /* 无 key：不渲染破图，保持灰底并已 console.warn */
      var cached = tileCacheOn ? tileCache[url] : null;
      if (cached) {
        html += '<img class="tile" style="left:' + left + 'px;top:' + top + 'px;width:256px;height:256px" ' +
          'src="' + cached + '">';
      } else {
        html += '<img class="tile" style="left:' + left + 'px;top:' + top + 'px;width:256px;height:256px" ' +
          (tileCacheOn ? 'crossorigin="anonymous" ' : '') +
          'src="' + url + '" onload="__tileLoaded(this,\'' + url + '\',\'' + layer + '\')" ' +
          'onerror="this.style.display=\'none\'">';
      }
    }
  }
  layerEl.innerHTML = html;
}

/* F-02 瓦片缓存：解码后存 dataURL（有上限），再渲染同一瓦片不再走网络。
 * 注意：天地图瓦片带 CORS 头，才允许 `crossorigin` + canvas 取数据；失败就静默不缓存。
 *
 * MD-03：注记层（cta/cia/cva）是**带 alpha 的 PNG**——天地图 cta z10 实测 49,503/65,536 像素全透明。
 * 统一 toDataURL("image/jpeg") 会把透明像素压成黑色，命中缓存后注记整块变黑。
 * 所以按图层选格式：注记层 PNG（保 alpha），底图层（img/ter/vec，不透明）继续 JPEG 0.85 省内存。 */
function isAlphaLayer(layer) { return layer === "cta" || layer === "cia" || layer === "cva"; }

function __tileLoaded(img, url, layer) {
  if (!tileCacheOn) return;
  try {
    var cv = document.createElement("canvas");
    cv.width = 256; cv.height = 256;
    cv.getContext("2d").drawImage(img, 0, 0);
    var d = isAlphaLayer(layer) ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.85);
    if (!tileCache[url]) {
      tileCacheKeys.push(url);
      if (tileCacheKeys.length > TILE_CACHE_MAX) delete tileCache[tileCacheKeys.shift()];
    }
    tileCache[url] = d;
  } catch (e) { /* 不可取像素（CORS/格式）时放弃缓存，不影响显示 */ }
}

function enableTileCache(on) {
  tileCacheOn = !!on;
  if (!tileCacheOn) { tileCache = {}; tileCacheKeys = []; }
  emit({ type: "cache", on: tileCacheOn, count: tileCacheKeys.length });
  console.log("LC3D cache on=" + tileCacheOn);
  return tileCacheOn;
}

/* ---- F-12 测量 / F-13 画笔 ------------------------------------------------
 * 测量：多点折线累计 Haversine 里程；闭合多边形球面面积。
 * 画笔：手指/鼠标轨迹，点存经纬度（与瓦片分离、不参与 DEM 拾取），按视角投影回屏幕。
 * 事件：measure / measure-clear / paint / paint-clear / paint-undo。
 * hash：&measure=dist|area、&paint。
 * ------------------------------------------------------------------------- */
var SVGNS = "http://www.w3.org/2000/svg";

function ensureSvg() {
  if (ovSvgEl) return ovSvgEl;
  ovSvgEl = document.createElementNS(SVGNS, "svg");
  ovSvgEl.setAttribute("id", "ovSvg");
  ovSvgEl.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;";
  mapEl.appendChild(ovSvgEl);
  return ovSvgEl;
}

function screenPointOf(lat, lng) {
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  if (mode === "3d") {
    if (!lastVP || !patch) return null;
    var wp = lonLatToWorld(lat, lng);
    if (!wp) return null;
    var v = projectPoint(wp, lastVP);
    if (!v || v.z < -1 || v.z > 1) return null;
    return { x: (v.x * 0.5 + 0.5) * w, y: (0.5 - v.y * 0.5) * h };
  }
  var c = lonLatToTile(center.lng, center.lat, zoom);
  var t = lonLatToTile(lng, lat, zoom);
  return { x: (t.x - c.x) * 256 + w / 2, y: (t.y - c.y) * 256 + h / 2 };
}

/* 3D 屏幕点 → 地形经纬度（与 pick3D 同一套射线/DEM 求交；失败返回 null） */
function demIntersectScreen(sx, sy) {
  if (!patch || !patch.mesh || !lastVP) return null;
  var ray = screenRay(sx, sy);
  if (!ray) return null;
  var maxT = lastD * 4;
  var step = Math.max(15, patch.mpp * 1.5);
  var above = -1, below = -1, t;
  for (t = 0; t <= maxT; t += step) {
    var px = ray.o.x + ray.d.x * t, py = ray.o.y + ray.d.y * t, pz = ray.o.z + ray.d.z * t;
    var g = worldToDem(px, pz);
    if (!g) continue;
    var hh = demAt(patch.z, g.gx, g.gy) * VEXAG;
    if (py > hh) above = t;
    else { below = t; if (above < 0) above = 0; break; }
  }
  if (below < 0) return null;
  for (var i = 0; i < 24; i++) {
    var tm = (above + below) / 2;
    var mx = ray.o.x + ray.d.x * tm, my = ray.o.y + ray.d.y * tm, mz = ray.o.z + ray.d.z * tm;
    var gm = worldToDem(mx, mz);
    if (!gm) break;
    var hm = demAt(patch.z, gm.gx, gm.gy) * VEXAG;
    if (my > hm) above = tm; else below = tm;
  }
  var th = (above + below) / 2;
  var gh = worldToDem(ray.o.x + ray.d.x * th, ray.o.z + ray.d.z * th);
  if (!gh) return null;
  var n = Math.pow(2, patch.z);
  return { lng: gh.gx / 256 / n * 360 - 180, lat: tileYToLat(gh.gy / 256, patch.z) };
}

function latLngOfScreen(sx, sy) {
  if (mode !== "3d") {
    var w = mapEl.clientWidth, h = mapEl.clientHeight;
    var c = lonLatToTile(center.lng, center.lat, zoom);
    var tx = c.x + (sx - w / 2) / 256, ty = c.y + (sy - h / 2) / 256;
    var n = Math.pow(2, zoom);
    return { lat: tileYToLat(ty, zoom), lng: tx / n * 360 - 180 };
  }
  return demIntersectScreen(sx, sy);
}

function haversineM(a, b) {
  var R = 6371008.8;
  var dLat = (b.lat - a.lat) * Math.PI / 180, dLng = (b.lng - a.lng) * Math.PI / 180;
  var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a.lat * Math.PI / 180) * Math.cos(b.lat * Math.PI / 180) *
    Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

function measureStats() {
  var pts = measure.pts, d = 0, a = 0;
  for (var i = 1; i < pts.length; i++) d += haversineM(pts[i - 1], pts[i]);
  if (measure.area && pts.length >= 3) {
    /* 局部 ENU 平面 + 鞋带公式：测量都是小区域（<几十 km），比球面多边形公式稳且好验。 */
    var R = 6371008.8;
    var lat0 = pts[0].lat * Math.PI / 180;
    var xy = [];
    for (var k = 0; k < pts.length; k++) {
      var dlng = (pts[k].lng - pts[0].lng) * Math.PI / 180;
      var dlat = (pts[k].lat - pts[0].lat) * Math.PI / 180;
      xy.push([R * dlng * Math.cos(lat0), R * dlat]);
    }
    var s2 = 0;
    for (var j = 0; j < xy.length; j++) {
      var p = xy[j], q = xy[(j + 1) % xy.length];
      s2 += p[0] * q[1] - q[0] * p[1];
    }
    a = Math.abs(s2) / 2;
  }
  return { distanceM: d, areaM2: a };
}

function fmtDist(m) { return m < 1000 ? Math.round(m) + " m" : (m / 1000).toFixed(2) + " km"; }
function fmtArea(a) {
  var base = a < 1e6 ? Math.round(a) + " m²" : (a / 1e6).toFixed(2) + " km²";
  return base + "（" + (a / 666.6667).toFixed(1) + " 亩）";
}

function measureEmit() {
  var s = measureStats();
  emit({
    type: "measure", mode: measure.area ? "area" : "distance",
    points: measure.pts.length,
    distanceM: Math.round(s.distanceM), areaM2: Math.round(s.areaM2),
    text: measure.area ? fmtArea(s.areaM2) : fmtDist(s.distanceM)
  });
}

function measureAdd(lat, lng) {
  measure.pts.push({ lat: lat, lng: lng });
  measureEmit();
  renderOverlays();
}

function renderOverlays() {
  var svg = ensureSvg();
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  while (svg.firstChild) svg.removeChild(svg.firstChild);

  if (measure.pts.length) {
    var P = [];
    for (var i = 0; i < measure.pts.length; i++) {
      var p = screenPointOf(measure.pts[i].lat, measure.pts[i].lng);
      if (p) P.push(p);
    }
    if (P.length >= 2) {
      var poly = document.createElementNS(SVGNS,
        (measure.area && P.length >= 3) ? "polygon" : "polyline");
      poly.setAttribute("points", P.map(function (q) { return q.x.toFixed(1) + "," + q.y.toFixed(1); }).join(" "));
      poly.setAttribute("fill", (measure.area && P.length >= 3) ? "rgba(255,200,80,0.18)" : "none");
      poly.setAttribute("stroke", "#ffcc55");
      poly.setAttribute("stroke-width", "2");
      svg.appendChild(poly);
    }
    for (var k = 0; k < P.length; k++) {
      var c = document.createElementNS(SVGNS, "circle");
      c.setAttribute("cx", P[k].x);
      c.setAttribute("cy", P[k].y);
      c.setAttribute("r", "3");
      c.setAttribute("fill", "#fff");
      c.setAttribute("stroke", "#ffcc55");
      svg.appendChild(c);
    }
  }

  for (var s = 0; s < paint.strokes.length; s++) {
    var st = paint.strokes[s];
    if (!st.pts || st.pts.length < 2) continue;
    var d = "";
    for (var q = 0; q < st.pts.length; q++) {
      var pp = screenPointOf(st.pts[q].lat, st.pts[q].lng);
      if (!pp) continue;
      d += (d ? "L" : "M") + pp.x.toFixed(1) + " " + pp.y.toFixed(1) + " ";
    }
    if (!d) continue;
    var path = document.createElementNS(SVGNS, "path");
    path.setAttribute("d", d);
    path.setAttribute("stroke", st.color);
    path.setAttribute("stroke-width", st.width);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("stroke-linejoin", "round");
    svg.appendChild(path);
  }
}

/* ---- F-12 API ---- */
function lc_measure_start(mode) {
  measure.on = true;
  measure.area = (mode === "area" || mode === true);
  measure.pts = [];
  measureEmit();
  renderOverlays();
  console.log("LC3D measure start mode=" + (measure.area ? "area" : "distance"));
  return true;
}
function lc_measure_clear() {
  var was = measure.on;
  measure.on = false;
  measure.area = false;
  measure.pts = [];
  renderOverlays();
  emit({ type: "measure-clear" });
  console.log("LC3D measure clear was=" + was);
}
function lc_measure_undo() {
  if (measure.pts.length) { measure.pts.pop(); measureEmit(); renderOverlays(); }
}
/* F-12 原版打点方式是「拖图把中心对到目标 → 点『添加点』」，不是点哪打哪
 * （原版 JS addCenterPoint(){ map.getCenter() → eventClick }，逆向 2ba81d0 查实）。
 * 这里取当前地图中心作为新测量点，落点与 placeMarker 的测量打点完全走同一条 measureAdd()：
 *   - 2D：center 就是瓦片反算出的经纬度中心；
 *   - 3D：render3D 里相机 lookAt 的 target 正是 center + 该点 DEM 高程，所以屏幕正中那一点
 *     与点选拾取（demIntersectScreen）落在同一地表位置，海拔用 elevAt(center) 同源取得；
 *   - 打点后不触发立向点：placeMarker 在 measure.on 时已直接 return，本接口根本不走 placeMarker。
 * 未进入测量态时按「距离测量」起步（等价 lc_measure_start('distance')），避免客户端按钮点了没反应。 */
function lc_measure_addCenter() {
  if (!isFinite(center.lat) || !isFinite(center.lng)) return false;
  if (!measure.on) { measure.on = true; measure.area = false; measure.pts = []; }
  measureAdd(center.lat, center.lng);
  console.log("LC3D measure addCenter lat=" + center.lat.toFixed(6) +
    " lng=" + center.lng.toFixed(6) + " mode=" + (measure.area ? "area" : "distance") +
    " elev=" + elevAt(center.lat, center.lng));
  return true;
}

/* ---- F-13 API ---- */
function paintStart(cx, cy) {
  if (!paint.on) return;
  var rect = mapEl.getBoundingClientRect();
  var ll = latLngOfScreen(cx - rect.left, cy - rect.top);
  if (!ll) return;
  paint.cur = { color: paint.color, width: paint.width, pts: [ll] };
  paint.strokes.push(paint.cur);
  renderOverlays();
}
function paintMove(cx, cy) {
  if (!paint.on || !paint.cur) return;
  var rect = mapEl.getBoundingClientRect();
  var ll = latLngOfScreen(cx - rect.left, cy - rect.top);
  if (!ll) return;
  var last = paint.cur.pts[paint.cur.pts.length - 1];
  if (last && haversineM(last, ll) < 0.5) return;
  paint.cur.pts.push(ll);
  renderOverlays();
}
function paintEnd() {
  if (!paint.cur) return;
  if (paint.cur.pts.length < 2) paint.strokes.pop();
  paint.cur = null;
  emit({ type: "paint", on: paint.on, strokes: paint.strokes.length, color: paint.color, width: paint.width });
  renderOverlays();
}
function lc_draw_start() {
  paint.on = true;
  emit({ type: "paint", on: true, strokes: paint.strokes.length, color: paint.color, width: paint.width });
  console.log("LC3D paint start");
  return true;
}
function lc_draw_end() {
  paint.on = false;
  paint.cur = null;
  renderOverlays();
  emit({ type: "paint", on: false, strokes: paint.strokes.length, color: paint.color, width: paint.width });
}
function lc_draw_style(color, width) {
  if (color) paint.color = String(color);
  if (width) paint.width = Math.max(1, Math.min(24, Number(width) || 4));
  emit({ type: "paint", on: paint.on, strokes: paint.strokes.length, color: paint.color, width: paint.width });
  return { color: paint.color, width: paint.width };
}
function lc_draw_undo() {
  if (paint.strokes.length) paint.strokes.pop();
  renderOverlays();
  emit({ type: "paint-undo", strokes: paint.strokes.length });
}
function lc_draw_clear() {
  paint.strokes = [];
  paint.cur = null;
  renderOverlays();
  emit({ type: "paint-clear" });
}
function lc_draw_export() {
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  var body = "";
  for (var s = 0; s < paint.strokes.length; s++) {
    var st = paint.strokes[s];
    if (!st.pts || st.pts.length < 2) continue;
    var d = "";
    for (var q = 0; q < st.pts.length; q++) {
      var pp = screenPointOf(st.pts[q].lat, st.pts[q].lng);
      if (!pp) continue;
      d += (d ? "L" : "M") + pp.x.toFixed(1) + " " + pp.y.toFixed(1) + " ";
    }
    if (d) body += '<path d="' + d + '" stroke="' + st.color + '" stroke-width="' + st.width +
      '" fill="none" stroke-linecap="round" stroke-linejoin="round"/>';
  }
  var svg = '<svg xmlns="' + SVGNS + '" width="' + w + '" height="' + h + '">' + body + "</svg>";
  try {
    return "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(svg)));
  } catch (e) {
    return "";
  }
}

/* ---- F-14 钓点图层 / F-03 海拔查询 -----------------------------------------
 * F-14：原版是私有 fish_tiles pbf + 付费钓点库（不可搬运）。LC 用「天地图公开水域
 *   点位 + 用户本机自建钓点」自绘图层：圆形水滴 + 单字（库/河/塘/黑），按类型分色，
 *   标签跟在点位下方。事件 fish / fish-pick；hash &fish。
 * F-03：点图取经纬度 → elevAt()（DEM 采样，取不到返回 null）→ 事件 elev。
 * ------------------------------------------------------------------------- */
function fishColor(t) {
  if (t === "库") return "#ff9f43";
  if (t === "河") return "#4aa3ff";
  if (t === "塘") return "#b06bff";
  if (t === "黑") return "#555555";
  return "#b06bff";
}

function ensureFishLayer() {
  if (fishLayerEl) return fishLayerEl;
  fishLayerEl = document.createElement("div");
  fishLayerEl.id = "fishLayer";
  fishLayerEl.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:9;";
  mapEl.appendChild(fishLayerEl);
  return fishLayerEl;
}

function setFishLayer(on, items) {
  fish.on = !!on;
  fish.items = [];
  fish.els = [];
  var dropped = 0;
  var layer = ensureFishLayer();
  layer.innerHTML = "";
  if (fish.on) {
    var list = items || [];
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p || typeof p.lat !== "number" || typeof p.lng !== "number") continue;
      /* MD-09：条数上限；F-14：地址与类型码（303/308/309/0）一并透传给点击事件 */
      if (fish.items.length >= LIMIT_FISH_POINTS) { dropped = list.length - i; break; }
      var type = fishChar(p.type);
      var el = document.createElement("div");
      el.className = "fish";
      el.style.background = fishColor(type);
      var ch = document.createElement("span");
      ch.textContent = type;
      el.appendChild(ch);
      var lbl = document.createElement("div");
      lbl.className = "fish-label";
      lbl.textContent = String(p.name || "");
      layer.appendChild(el);
      layer.appendChild(lbl);
      var typeCode = (typeof p.typeCode === "number") ? p.typeCode : fishTypeCode(type);
      fish.items.push({
        name: String(p.name || ""), type: type, typeCode: typeCode,
        address: String(p.address || ""), lat: p.lat, lng: p.lng
      });
      fish.els.push({ el: el, lbl: lbl });
      (function (pt) {
        el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          /* F-14：补 address 与类型码，客户端详情卡不再空白 */
          emit({
            type: "fish-pick", name: pt.name, kind: pt.type, typeCode: pt.typeCode,
            address: pt.address, lat: pt.lat, lng: pt.lng
          });
        });
      })(fish.items[fish.items.length - 1]);
    }
  }
  emit({ type: "fish", on: fish.on, count: fish.items.length, dropped: dropped });
  updateFish(mode === "3d" ? lastVP : null);
  console.log("LC3D fish on=" + fish.on + " count=" + fish.items.length + " dropped=" + dropped);
  return fish.items.length;
}

/* F-14 类型码（原版 payType：303 库钓 / 308 河钓 / 309 黑坑 / 其它=0 塘钓）。
 * 只是**码位映射**，不携带原版任何数据；黑坑(309)没有公开数据源，不会由本层产出，
 * 保留码位是为了客户端按原版展示同一套文字。 */
var FISH_TYPE_CODES = { "库": 303, "河": 308, "黑": 309, "塘": 0 };

function fishTypeCode(type) {
  var c = FISH_TYPE_CODES[type];
  return (typeof c === "number") ? c : 0;
}

function fishChar(t) {
  return (t === "库" || t === "河" || t === "塘" || t === "黑") ? t : "塘";
}

function updateFish(vp) {
  if (!fish.els.length) return;
  for (var i = 0; i < fish.items.length; i++) {
    var pt = fish.items[i], e = fish.els[i];
    var s = screenPointOf(pt.lat, pt.lng);
    if (!s) { e.el.style.display = "none"; e.lbl.style.display = "none"; continue; }
    e.el.style.display = "block";
    e.lbl.style.display = "block";
    e.el.style.left = s.x + "px";
    e.el.style.top = s.y + "px";
    e.lbl.style.left = s.x + "px";
    e.lbl.style.top = (s.y + 4) + "px";
  }
}

function lc_setFishLayer(on, items) { return setFishLayer(on, items); }

function lc_elev_query(on) {
  elevQuery.on = !!on;
  emit({ type: "elev-query", on: elevQuery.on });
  return elevQuery.on;
}

function queryElevation(lng, lat) {
  return elevAt(lat, lng);
}

function lc_queryElevation(lng, lat) { return elevAt(lat, lng); }

/* ---- F-05 叠加：多图层（点位型，独立开关 + 透明度） ------------------------
 * 原版是 21at/私有瓦片专题（行政区/公路/铁路/公园/火山/植被/机场/世遗/丝路/景区/
 * 港口/十线/aeroway），不可照搬。LC 只对得上公开源的点位做层（天地图分类搜索），
 * 对不上的图层不建空壳（页面置灰写原因）。
 * API：setOverlayLayer(id,on,{opacity,items})、setOverlayOpacity(id,v)、getOverlays()
 * 事件：overlay-layer；hash &overlay=id1,id2（AT 用，空数据层只验证状态）。
 * -------------------------------------------------------------------------- */
function ovLayersEnsure() {
  if (ovLayersEl) return ovLayersEl;
  ovLayersEl = document.createElement("div");
  ovLayersEl.id = "ovLayers";
  ovLayersEl.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:7;";
  mapEl.appendChild(ovLayersEl);
  return ovLayersEl;
}

function setOverlayLayer(id, on, opts) {
  if (!id) return null;
  opts = opts || {};
  var layer = ovLayers[id] || { id: String(id), on: false, opacity: 1, items: [], els: [], container: null };
  layer.on = !!on;
  if (typeof opts.opacity === "number") layer.opacity = Math.max(0, Math.min(1, opts.opacity));
  if (opts.items) {
    var list = opts.items, items = [], dropped = 0;
    for (var i = 0; i < list.length; i++) {
      var p = list[i];
      if (!p || typeof p.lat !== "number" || typeof p.lng !== "number") continue;
      if (items.length >= LIMIT_OVERLAY_POINTS) { dropped = list.length - i; break; }   /* MD-09 */
      items.push({ name: String(p.name || ""), lat: p.lat, lng: p.lng });
    }
    layer.items = items;
    layer.dropped = dropped;
  } else if (typeof layer.dropped !== "number") {
    layer.dropped = 0;
  }
  ovLayers[id] = layer;
  ovLayerRebuild(layer);
  emit({ type: "overlay-layer", id: layer.id, on: layer.on, opacity: layer.opacity, count: layer.items.length, dropped: layer.dropped || 0 });
  updateOverlayLayers();
  return { id: layer.id, on: layer.on, opacity: layer.opacity, count: layer.items.length, dropped: layer.dropped || 0 };
}

function setOverlayOpacity(id, v) {
  var layer = ovLayers[id];
  if (!layer) return null;
  layer.opacity = Math.max(0, Math.min(1, Number(v) || 0));
  if (layer.container) layer.container.style.opacity = String(layer.opacity);
  emit({ type: "overlay-layer", id: layer.id, on: layer.on, opacity: layer.opacity, count: layer.items.length });
  return layer.opacity;
}

function ovLayerRebuild(layer) {
  var root = ovLayersEnsure();
  if (layer.container) { layer.container.remove(); layer.container = null; }
  layer.els = [];
  var box = document.createElement("div");
  box.style.cssText = "position:absolute;inset:0;opacity:" + layer.opacity + ";";
  root.appendChild(box);
  layer.container = box;
  if (!layer.on) return;
  for (var i = 0; i < layer.items.length; i++) {
    (function (pt) {
      var dot = document.createElement("div");
      dot.className = "ovdot";
      dot.style.cssText = "position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd479;" +
        "border:1px solid #5a4320;transform:translate(-50%,-50%);";
      var lbl = document.createElement("div");
      lbl.className = "ovlabel";
      lbl.style.opacity = "0.9";
      lbl.textContent = pt.name;
      box.appendChild(dot);
      box.appendChild(lbl);
      layer.els.push({ dot: dot, lbl: lbl, item: pt });
    })(layer.items[i]);
  }
}

function updateOverlayLayers() {
  var ids = Object.keys(ovLayers);
  for (var k = 0; k < ids.length; k++) {
    var layer = ovLayers[ids[k]];
    if (!layer || !layer.on) continue;
    for (var i = 0; i < layer.els.length; i++) {
      var e = layer.els[i];
      var s = screenPointOf(e.item.lat, e.item.lng);
      if (!s) { e.dot.style.display = "none"; e.lbl.style.display = "none"; continue; }
      e.dot.style.display = "block";
      e.lbl.style.display = "block";
      e.dot.style.left = s.x + "px";
      e.dot.style.top = s.y + "px";
      e.lbl.style.left = s.x + "px";
      e.lbl.style.top = (s.y + 4) + "px";
    }
  }
}

function getOverlays() {
  var out = {};
  var ids = Object.keys(ovLayers);
  for (var i = 0; i < ids.length; i++) {
    var l = ovLayers[ids[i]];
    out[ids[i]] = { on: l.on, opacity: round2(l.opacity), count: l.items.length };
  }
  return out;
}

function round2(v) { return Math.round(v * 100) / 100; }

/* F-05 内置层：等高线（DEM 着色器）显式开关，供叠加页统一调用 */
/* ---- F-15 轨迹回放桥 --------------------------------------------------------
 * 客户端负责记录/列表/详情；这里只吃「分段点列」并做动画回放。
 * 数据形态：segments = [[{lat,lng,t}, …], …]，按段分开、不跨段连线；t 为毫秒。
 * 渲染：全段暗色底 + 已播放段按速度 5 档着色（<3 灰 / 3–6 绿 / 6–12 蓝 / 12–25 橙 / >25 红）
 *       + 播放光标；**不插值补点**（线只连真实点，只有光标按时间在相邻点间移动）。
 * 事件：track-loaded、track-tick、track-clear；getState().track。
 * -------------------------------------------------------------------------- */
var TRACK_BANDS = [
  { max: 3, color: "#9aa0a6" },
  { max: 6, color: "#2ecc71" },
  { max: 12, color: "#3498db" },
  { max: 25, color: "#f39c12" },
  { max: Infinity, color: "#e74c3c" }
];

function trackColor(kmh) {
  for (var i = 0; i < TRACK_BANDS.length; i++) {
    if (kmh < TRACK_BANDS[i].max) return TRACK_BANDS[i].color;
  }
  return TRACK_BANDS[TRACK_BANDS.length - 1].color;
}

function ensureTrackSvg() {
  if (trackSvgEl) return trackSvgEl;
  trackSvgEl = document.createElementNS(SVGNS, "svg");
  trackSvgEl.setAttribute("id", "trackSvg");
  trackSvgEl.style.cssText = "position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:8;";
  mapEl.appendChild(trackSvgEl);
  return trackSvgEl;
}

function trackTotalPoints() {
  var n = 0;
  for (var i = 0; i < track.segments.length; i++) n += track.segments[i].length;
  return n;
}

/** 取 t 时刻的插值位置（只在相邻真实点之间移动，不造点）。 */
function trackPosAt(t) {
  for (var s = 0; s < track.segments.length; s++) {
    var seg = track.segments[s];
    if (!seg.length) continue;
    if (t <= seg[0].t) return { lat: seg[0].lat, lng: seg[0].lng, spd: seg[0].spd || 0, seg: s };
    if (t >= seg[seg.length - 1].t) {
      if (s === track.segments.length - 1) {
        var last = seg[seg.length - 1];
        return { lat: last.lat, lng: last.lng, spd: last.spd || 0, seg: s };
      }
      continue;
    }
    for (var i = 1; i < seg.length; i++) {
      if (t <= seg[i].t) {
        var a = seg[i - 1], b = seg[i];
        var dt = b.t - a.t;
        var k = dt > 0 ? (t - a.t) / dt : 0;
        return {
          lat: a.lat + (b.lat - a.lat) * k,
          lng: a.lng + (b.lng - a.lng) * k,
          spd: (a.spd || 0) + ((b.spd || 0) - (a.spd || 0)) * k,
          seg: s
        };
      }
    }
  }
  return null;
}

/** 数一个段列表里「合法点」的总数（MD-09 上限判定与 dropped 统计用）。 */
function countTrackPointsFrom(list, from) {
  var n = 0;
  for (var s = from; s < list.length; s++) {
    var raw = list[s];
    if (!raw || !raw.length) continue;
    for (var i = 0; i < raw.length; i++) {
      var p = raw[i];
      if (p && typeof p.lat === "number" && typeof p.lng === "number" && typeof p.t === "number") n++;
    }
  }
  return n;
}

function lc_track_load(segments) {
  track.playing = false;
  track.loaded = false;
  track.segments = [];
  track.t0 = 0;
  track.t1 = 0;
  track.t = 0;
  var list = segments || [];
  var totalIn = countTrackPointsFrom(list, 0);   /* 入参里合法点总数（截断后用于报 dropped） */
  var kept = 0;
  for (var s = 0; s < list.length; s++) {
    if (track.segments.length >= LIMIT_TRACK_SEGMENTS) break;   /* MD-09：段数上限 */
    if (kept >= LIMIT_TRACK_POINTS) break;                      /* MD-09：总点数上限 */
    var raw = list[s];
    if (!raw || !raw.length) continue;
    var seg = [];
    for (var i = 0; i < raw.length && (kept + seg.length) < LIMIT_TRACK_POINTS; i++) {
      var p = raw[i];
      if (!p || typeof p.lat !== "number" || typeof p.lng !== "number" || typeof p.t !== "number") continue;
      seg.push({ lat: p.lat, lng: p.lng, t: p.t, spd: 0 });
    }
    if (!seg.length) continue;
    kept += seg.length;
    /* 段内按时间排序（客户端可能乱序），再算逐点速度（前后点平均） */
    seg.sort(function (a, b) { return a.t - b.t; });
    for (var k = 0; k < seg.length; k++) {
      var a = seg[Math.max(0, k - 1)], b = seg[Math.min(seg.length - 1, k + 1)];
      var dt = (b.t - a.t) / 1000;
      seg[k].spd = dt > 0 ? haversineM(a, b) / dt * 3.6 : 0;
    }
    track.segments.push(seg);
  }
  var dropped = Math.max(0, totalIn - kept);
  var t0 = Infinity, t1 = -Infinity;
  for (var m = 0; m < track.segments.length; m++) {
    var sg = track.segments[m];
    if (sg[0].t < t0) t0 = sg[0].t;
    if (sg[sg.length - 1].t > t1) t1 = sg[sg.length - 1].t;
  }
  track.loaded = track.segments.length > 0;
  track.t0 = track.loaded ? t0 : 0;
  track.t1 = track.loaded ? t1 : 0;
  track.t = track.t0;
  if (track.loaded && track.follow) {
    var st = trackPosAt(track.t0);
    if (st) {
      center = { lat: st.lat, lng: st.lng };
      if (mode === "3d") ensurePatch(); else render();
    }
  }
  updateTrack();
  emit({
    type: "track-loaded", segments: track.segments.length, points: trackTotalPoints(),
    dropped: dropped,
    t0: Math.round(track.t0), t1: Math.round(track.t1)
  });
  console.log("LC3D track loaded seg=" + track.segments.length + " pts=" + trackTotalPoints() +
    " dropped=" + dropped);
  return track.loaded;
}

/* 相机跟随（MD-05）：2D 下**不再每帧 render()**。
 * 只让光标在画面上走，当前点离开画面中心 30% 安全框时才平移一次相机并重绘瓦片；
 * 3D 下 ensurePatch() 自己按瓦片变化早退，保持原行为。 */
function followTrack(p) {
  if (mode === "3d") {
    center = { lat: p.lat, lng: p.lng };
    ensurePatch();
    return;
  }
  var s = screenPointOf(p.lat, p.lng);
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  if (s && s.x >= w * 0.3 && s.x <= w * 0.7 && s.y >= h * 0.3 && s.y <= h * 0.7) return;
  center = { lat: p.lat, lng: p.lng };
  render();
}

function lc_track_progress(t0) {
  if (!track.loaded) return false;
  var v = Number(t0);
  if (!isFinite(v)) return false;
  track.t = (v >= 0 && v <= 1)
    ? track.t0 + v * (track.t1 - track.t0)
    : Math.max(track.t0, Math.min(track.t1, v));
  var p = trackPosAt(track.t);
  if (track.follow && p) followTrack(p);
  updateTrack();
  emit({
    type: "track-tick", t: Math.round(track.t), atEnd: track.t >= track.t1,
    lat: p ? p.lat : null, lng: p ? p.lng : null,
    speedKmh: p ? Math.round(p.spd * 10) / 10 : 0
  });
  return true;
}

function lc_track_play(rate) {
  if (!track.loaded) return false;
  if (rate === 1 || rate === 2 || rate === 4 || rate === 8) track.rate = rate;
  if (track.t >= track.t1) track.t = track.t0;
  track.playing = true;
  track.lastTs = 0;
  if (!track.raf) track.raf = requestAnimationFrame(trackAnim);
  return true;
}

function lc_track_pause() {
  track.playing = false;
  return true;
}

function lc_track_follow(on) {
  track.follow = !!on;
  return track.follow;
}

function lc_track_clear() {
  track.playing = false;
  track.loaded = false;
  track.segments = [];
  track.t0 = track.t1 = track.t = 0;
  if (trackSvgEl) trackSvgEl.innerHTML = "";
  trackCursorEl = null;          /* SVG 已清空，光标引用一并作废 */
  emit({ type: "track-clear" });
  console.log("LC3D track clear");
}

/** 轨迹重绘间隔（MD-05）：光标每帧只改 cx/cy，整条轨迹按 ~8 Hz 重绘。 */
var TRACK_REDRAW_MS = 120;

function trackAnim(ts) {
  track.raf = 0;
  if (!track.playing || !track.loaded) return;
  if (!track.lastTs) track.lastTs = ts;
  var dt = Math.min(0.5, (ts - track.lastTs) / 1000);
  track.lastTs = ts;
  track.t = Math.min(track.t1, track.t + dt * 1000 * track.rate);
  var p = trackPosAt(track.t);
  /* MD-05：跟随不再每帧重建瓦片层；光标单独逐帧更新 */
  if (track.follow && p) followTrack(p);
  if (ts - (track.lastDraw || 0) >= TRACK_REDRAW_MS) {
    track.lastDraw = ts;
    updateTrack();
  } else {
    updateTrackCursor();
  }
  var now = Date.now();
  if (now - track.lastEmit > 120 || track.t >= track.t1) {
    track.lastEmit = now;
    emit({
      type: "track-tick", t: Math.round(track.t), atEnd: track.t >= track.t1,
      lat: p ? p.lat : null, lng: p ? p.lng : null,
      speedKmh: p ? Math.round(p.spd * 10) / 10 : 0
    });
  }
  if (track.t < track.t1) track.raf = requestAnimationFrame(trackAnim);
  else { track.playing = false; track.raf = 0; }
}

function trackPolyline(svg, pts, color, width, opacity) {
  if (pts.length < 2) return;
  var line = document.createElementNS(SVGNS, "polyline");
  var d = "";
  for (var i = 0; i < pts.length; i++) d += pts[i].x.toFixed(1) + "," + pts[i].y.toFixed(1) + " ";
  line.setAttribute("points", d);
  line.setAttribute("fill", "none");
  line.setAttribute("stroke", color);
  line.setAttribute("stroke-width", String(width));
  line.setAttribute("stroke-opacity", String(opacity));
  line.setAttribute("stroke-linecap", "round");
  line.setAttribute("stroke-linejoin", "round");
  svg.appendChild(line);
}

function updateTrack() {
  var svg = ensureTrackSvg();
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!track.loaded) return;

  for (var s = 0; s < track.segments.length; s++) {
    var seg = track.segments[s];
    var proj = [];
    for (var i = 0; i < seg.length; i++) {
      var p = screenPointOf(seg[i].lat, seg[i].lng);
      if (!p) { proj.push(null); continue; }
      proj.push({ x: p.x, y: p.y, t: seg[i].t, spd: seg[i].spd });
    }
    var plain = [];
    for (var q = 0; q < proj.length; q++) if (proj[q]) plain.push(proj[q]);
    trackPolyline(svg, plain, "#6b6b6b", 2, 0.45);

    /* 已播放部分：按速度档分段着色 */
    var run = [], runColor = null;
    for (var r = 0; r < proj.length; r++) {
      var pt = proj[r];
      if (!pt) continue;
      if (pt.t > track.t) break;
      var c = trackColor(pt.spd);
      if (runColor !== null && c !== runColor) {
        trackPolyline(svg, run, runColor, 4, 0.95);
        run = [];
      }
      runColor = c;
      run.push(pt);
    }
    /* 光标头（同一段内做插值端点） */
    var cur = trackPosAt(track.t);
    if (cur && cur.seg === s && run.length) {
      var hp = screenPointOf(cur.lat, cur.lng);
      if (hp) run.push({ x: hp.x, y: hp.y });
    }
    if (run.length >= 2 && runColor) trackPolyline(svg, run, runColor, 4, 0.95);
  }

  /* MD-05：光标是一个复用的 circle（trackCursorEl），整条轨迹重绘后重新挂上它；
   * 两次重绘之间只改 cx/cy，不再每帧新建节点。 */
  trackCursorEl = null;
  ensureTrackCursor(svg);
  updateTrackCursor();
}

function ensureTrackCursor(svg) {
  trackCursorEl = document.createElementNS(SVGNS, "circle");
  trackCursorEl.setAttribute("r", "6");
  trackCursorEl.setAttribute("fill", "#ffffff");
  trackCursorEl.setAttribute("stroke", "#e74c3c");
  trackCursorEl.setAttribute("stroke-width", "2");
  trackCursorEl.style.display = "none";
  svg.appendChild(trackCursorEl);
  return trackCursorEl;
}

/** 只更新光标位置（每帧可调，O(1)）。 */
function updateTrackCursor() {
  if (!track.loaded || !trackCursorEl) return;
  var c = trackPosAt(track.t);
  var p = c ? screenPointOf(c.lat, c.lng) : null;
  if (!p) { trackCursorEl.style.display = "none"; return; }
  trackCursorEl.style.display = "";
  trackCursorEl.setAttribute("cx", p.x.toFixed(1));
  trackCursorEl.setAttribute("cy", p.y.toFixed(1));
}

function setContour(on) {
  if (!!on !== contourOn) toggleContour();
  return contourOn;
}

function setBase(b) {
  if (roadNet && b !== "vec") {
    /* 路网视图下切到别的底图 = 退出路网视图（F-04） */
    roadNet = false;
    baseBeforeRoad = null;
    syncRoadBtn();
    emit({ type: "roadnet", on: false, mode: "base" });
  }
  base = b;
  anno = (b === "img") ? "cia" : (b === "ter" ? "cta" : (b === "wayback" ? "" : "cva"));
  document.getElementById("btn_vec").className = (b === "vec") ? "active" : "";
  document.getElementById("btn_img").className = (b === "img") ? "active" : "";
  document.getElementById("btn_ter").className = (b === "ter") ? "active" : "";
  if (mode === "3d") {
    drape = b;
    refreshPatchTexture();
    updateHud();
  } else {
    render();
  }
  updateSrcInfo();
}

/* ---- F-04 路网视图 ----------------------------------------------------------
 * 免费替代：天地图 vec 路网图面 + cva 路名注记；进入前记住 base，关闭时恢复。
 * 3D 下 setBase 会重建贴面，所以「路网视图」在 3D 同样生效。
 * 边界：天地图没有实时路况服务，这里不画任何红/黄/绿路况线（不做假数据）。
 * 事件走 LCAndroid.onEvent：{"type":"roadnet","on":bool,"mode":"vec|base"}
 * -------------------------------------------------------------------------- */
function toggleRoadNet() { setRoadNet(!roadNet); }

function setRoadNet(on) {
  on = !!on;
  if (on === roadNet) { syncRoadBtn(); return roadNet; }
  roadNet = on;
  if (on) {
    baseBeforeRoad = base;
    setBase("vec");
  } else {
    setBase(baseBeforeRoad || "ter");
    baseBeforeRoad = null;
  }
  syncRoadBtn();
  emit({ type: "roadnet", on: roadNet, mode: on ? "vec" : "base" });
  console.log("LC3D roadnet on=" + roadNet + " base=" + base);
  return roadNet;
}

function syncRoadBtn() {
  var b = document.getElementById("btn_road");
  if (b) b.className = roadNet ? "active" : "";
}

/* ---- F-06 山脊：DEM 曲率派生高亮（近似，不是官方山脉边界） ---- */
function toggleRidge() { setRidge(!ridgeOn); }

function setRidge(on) {
  ridgeOn = !!on;
  var b = document.getElementById("btn_ridge");
  if (b) b.className = ridgeOn ? "active" : "";
  emit({ type: "ridge", on: ridgeOn });
  updateHud();
  console.log("LC3D ridge on=" + ridgeOn);
  return ridgeOn;
}

/* ---- F-10 历史影像（Esri Wayback 近似） -------------------------------------
 * 原版是 Google Earth 历年影像（dex: GoogleHistoryHelper/DBRootV5/QTree），不可合规接入；
 * 免费近似只有 Esri Wayback（公开历年影像瓦片，释放号见 waybackconfig.json），
 * 来源/许可：Esri, Maxar, Earthstar Geographics 等（Esri 服务条款，自用展示需标注）。
 * 另一个可选近似是 Sentinel-2（Copernicus），但需注册/下载、非在线瓦片，这里不接。
 * -------------------------------------------------------------------------- */
function setWayback(on, release) {
  on = !!on;
  if (release) wbRelease = wbSafeRelease(release);   /* MD-11：白名单校验后再用 */
  if (!wbRelease) wbRelease = WB_DEFAULT_RELEASE;
  wbOn = on;
  if (on) {
    if (base !== "wayback") baseBeforeWb = base;
    setBase("wayback");
  } else {
    setBase(baseBeforeWb || "img");
    baseBeforeWb = null;
  }
  emit({ type: "wayback", on: wbOn, release: wbRelease });
  console.log("LC3D wayback on=" + wbOn + " release=" + wbRelease);
  return wbOn;
}

function setWaybackRelease(release) {
  wbRelease = wbSafeRelease(release);                /* MD-11：非法释放号退回默认时相 */
  if (wbOn) {
    if (mode === "3d") { drape = "wayback"; refreshPatchTexture(); } else render();
  }
  return wbRelease;
}

/* ---- F-06/F-07 点标叠加 ----------------------------------------------------
 * setOverlay(kind, points)：
 *   kind = "mountain" | "water"（只做分组标识，不改变渲染）；
 *   points = [{name, lat, lng}]，来自天地图分类搜索（山 260203 / 河 260204 / 湖 260205）。
 * 标签是可点的 DOM，点击发 overlay-pick（含 DEM 高程，取不到为 null）。
 * 2D 用瓦片坐标定位、文字反向旋转保持正立；3D 用投影矩阵逐帧定位。
 * -------------------------------------------------------------------------- */
function ovEnsureLayer() {
  if (ovLayer) return ovLayer;
  ovLayer = document.createElement("div");
  ovLayer.id = "ovLayer";
  ovLayer.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:7;";
  mapEl.appendChild(ovLayer);
  return ovLayer;
}

function clearOverlay() {
  ovKind = ""; ovPoints = []; ovEls = [];
  if (ovLayer) ovLayer.innerHTML = "";
}

function setOverlay(kind, points) {
  clearOverlay();
  ovKind = kind ? String(kind) : "";
  var list = points || [], dropped = 0;
  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    if (!p || typeof p.lat !== "number" || typeof p.lng !== "number") continue;
    if (ovPoints.length >= LIMIT_OVERLAY_POINTS) { dropped = list.length - i; break; }   /* MD-09 */
    ovPoints.push({ name: String(p.name || ""), address: String(p.address || ""), lat: p.lat, lng: p.lng });
  }
  var layer = ovEnsureLayer();
  for (var j = 0; j < ovPoints.length; j++) {
    (function (pt) {
      var el = document.createElement("div");
      el.className = "ovlabel";
      el.textContent = pt.name;
      el.addEventListener("click", function (ev) {
        ev.stopPropagation();
        emit({
          type: "overlay-pick", kind: ovKind, name: pt.name, address: pt.address,
          lat: pt.lat, lng: pt.lng, elev: elevAt(pt.lat, pt.lng)
        });
      });
      layer.appendChild(el);
      ovEls.push(el);
    })(ovPoints[j]);
  }
  emit({ type: "overlay", kind: ovKind, count: ovPoints.length, dropped: dropped });
  updateOverlay(mode === "3d" ? lastVP : null);
  console.log("LC3D overlay kind=" + ovKind + " count=" + ovPoints.length + " dropped=" + dropped);
  return ovPoints.length;
}

function updateOverlay(vp) {
  if (!ovEls.length) return;
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  var c = lonLatToTile(center.lng, center.lat, zoom);
  var rot = (mode === "2d") ? -bearing : 0;
  for (var i = 0; i < ovPoints.length; i++) {
    var pt = ovPoints[i], el = ovEls[i];
    var sx = 0, sy = 0, vis = false;
    if (mode === "3d") {
      if (!vp || !patch) { el.style.display = "none"; continue; }
      var wp = lonLatToWorld(pt.lat, pt.lng);
      if (!wp) { el.style.display = "none"; continue; }
      var v = projectPoint(wp, vp);
      if (!v || v.z < -1 || v.z > 1) { el.style.display = "none"; continue; }
      sx = (v.x * 0.5 + 0.5) * w;
      sy = (0.5 - v.y * 0.5) * h;
      vis = true;
    } else {
      var t = lonLatToTile(pt.lng, pt.lat, zoom);
      sx = (t.x - c.x) * 256 + w / 2;
      sy = (t.y - c.y) * 256 + h / 2;
      vis = sx > -80 && sx < w + 80 && sy > -24 && sy < h + 24;
    }
    if (!vis) { el.style.display = "none"; continue; }
    el.style.display = "block";
    el.style.left = sx + "px";
    el.style.top = sy + "px";
    el.style.transform = "translate(-50%,-100%) rotate(" + rot + "deg)";
  }
}

/* 经纬度 → 3D 世界坐标（与 render3D 的块中心/缩放同一套换算） */
function lonLatToWorld(lat, lng) {
  if (!patch) return null;
  var t = lonLatToTile(lng, lat, patch.z);
  var cxPx = (patch.ox + 1.5) * 256, cyPx = (patch.oy + 1.5) * 256;
  var x = (t.x * 256 - cxPx) * patch.mpp;
  var z = (t.y * 256 - cyPx) * patch.mpp;
  var e = elevAt(lat, lng);
  return { x: x, y: (e === null ? 0 : e) * VEXAG, z: z };
}

/* 取真实海拔（米）；DEM 瓦片没加载时返回 null，绝不返回 0 当哨兵 */
function elevAt(lat, lng) {
  var z = patch ? patch.z : Math.max(4, Math.min(12, Math.round(zoom) - 1));
  var t = lonLatToTile(lng, lat, z);
  var gx = t.x * 256, gy = t.y * 256;
  var x0 = Math.floor(gx), y0 = Math.floor(gy);
  var fx = gx - x0, fy = gy - y0;
  var a = demPix(z, x0, y0), b = demPix(z, x0 + 1, y0);
  var c2 = demPix(z, x0, y0 + 1), d = demPix(z, x0 + 1, y0 + 1);
  if (a === null || b === null || c2 === null || d === null) return null;
  var v = a * (1 - fx) * (1 - fy) + b * fx * (1 - fy) + c2 * (1 - fx) * fy + d * fx * fy;
  return Math.round(v * 10) / 10;
}

/* R2-007 / F-03：2D 下按点补拉 DEM 瓦片，再同步采样。
 * 背景：elevAt 只在 DEM 缓存有该 z 的瓦片时返回数值；DEM 平时由 3D patch(ensurePatch) 拉，
 * 所以 2D 固定态直接调 elevAt 必为 null。这里只补「该点 2×2 像素涉及的 1~2 个瓦片」，
 * 不切 3D、不改相机、不建 patch。 */
function elevDemZ() {
  return patch ? patch.z : Math.max(4, Math.min(12, Math.round(zoom) - 1));
}
function demPrefetchFor(lat, lng) {
  var z = elevDemZ();
  var t = lonLatToTile(lng, lat, z);
  var px = t.x * 256, py = t.y * 256;
  var x0 = Math.floor(px), y0 = Math.floor(py);
  var jobs = [];
  var seen = {};
  [[x0, y0], [x0 + 1, y0], [x0, y0 + 1], [x0 + 1, y0 + 1]].forEach(function (p) {
    var n = Math.pow(2, z);
    var tx = Math.floor(p[0] / 256), ty = Math.floor(p[1] / 256);
    if (ty < 0 || ty >= n) return;
    tx = wrapX(tx, n);
    var k = z + "/" + tx + "/" + ty;
    if (seen[k]) return;
    seen[k] = 1;
    jobs.push(demTile(z, tx, ty));
  });
  if (!jobs.length) return Promise.reject(new Error("dem-oob"));
  return Promise.all(jobs);
}
/* 异步取高程：缓存命中走同步；否则拉瓦片后回调（取不到仍回 null，不编 0） */
function elevAtAsync(lat, lng, cb) {
  var e = elevAt(lat, lng);
  if (e !== null) { cb(e); return; }
  demPrefetchFor(lat, lng).then(function () {
    cb(elevAt(lat, lng));
  }).catch(function () {
    cb(null);
  });
}

function attributionText(s) {
  s = s || { name: "天地图地形", review: "未确认" };

 * MD-02：以**当前实际底图**为准（base==="wayback" 时给 Esri 文案），不能沿用上一次的 srcIndex。 */
function getAttribution() {
  var i = sourceOfBase(base);
  if (i < 0) i = srcIndex;
  var s = MAP_SOURCES[i] || { name: "天地图地形", review: "未确认" };
  var wb = (s.layer === "wayback");
  return {
    source: s.name,
    review: s.review || "未确认",
    original: wb ? null : "世纪空间",
    equivalent: !wb,
    text: attributionText(s)
  };
}

function updateSrcInfo() {
  var i = sourceOfBase(base);
  if (i >= 0) srcIndex = i;
  var s = MAP_SOURCES[srcIndex] || { name: "天地图地形", review: "未确认" };
