<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>天地图</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#181410; overflow:hidden;
    font-family:sans-serif; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  #map { position:absolute; inset:0; overflow:hidden; }
  #gl { position:absolute; inset:0; width:100%; height:100%; display:none; }
  .tile { position:absolute; user-select:none; -webkit-user-drag:none; pointer-events:none; }
  #controls { position:absolute; left:10px; top:10px; z-index:10; }
  #controls button { display:block; width:92px; margin-bottom:5px; padding:7px 4px; background:#201a14;
    color:#dcbe82; border:1px solid #5a4a30; border-radius:6px; font-size:13px; }
  #controls button.active { background:#5a4a30; color:#fff; }
  #pitchWrap { display:none; margin:0 0 5px 0; width:92px; }
  #pitchWrap input { width:92px; }
  #hint { position:absolute; left:10px; bottom:10px; color:#968268; font-size:11px; z-index:10; max-width:74%; }
  #hud { position:absolute; right:10px; top:10px; z-index:10; color:#dcbe82; font-size:12px; line-height:1.55;
    background:#201a14cc; border:1px solid #5a4a30; border-radius:6px; padding:5px 8px;
    white-space:pre; display:none; }
  #needle { position:absolute; left:50%; top:50%; width:2px; height:34vw; max-height:140px;
    margin-left:-1px; margin-top:-34vw; background:linear-gradient(180deg,#ff4444,transparent);
    transform-origin:50% 100%; z-index:6; pointer-events:none; }
  #heading-label { position:absolute; left:50%; top:8px; transform:translateX(-50%);
    color:#ff6666; font-size:13px; z-index:6; background:#201a14cc; padding:2px 8px; border-radius:6px; }
  .marker { position:absolute; width:14px; height:14px; margin:-7px; border-radius:50%;
    background:#ff4444; border:2px solid #fff; z-index:7; pointer-events:none; box-shadow:0 0 4px #000; }
  #fsExit { position:fixed; right:10px; bottom:70px; z-index:30; display:none; padding:9px 14px;
    background:#201a14e6; color:#dcbe82; border:1px solid #5a4a30; border-radius:8px; font-size:14px; }
  #srcInfo { position:absolute; right:10px; bottom:8px; z-index:9; color:#968268; font-size:11px;
    background:#201a14cc; padding:2px 6px; border-radius:5px; }
  #srcPanel { position:absolute; inset:0; background:#00000099; z-index:20; display:none; }
  #srcPanel .box { position:absolute; left:10px; right:10px; top:70px; max-height:72%; overflow:auto;
    background:#201a14f5; border:1px solid #5a4a30; border-radius:10px; padding:10px; }
  #srcPanel h3 { margin:2px 0 8px 2px; color:#dcbe82; font-size:14px; }
  #srcPanel .srchint { color:#968268; font-size:11px; margin:0 0 8px 2px; }
  .srcItem { display:block; width:100%; text-align:left; padding:9px 10px; margin-bottom:5px;
    background:#2a231b; color:#dcbe82; border:1px solid #4a3c28; border-radius:6px; font-size:13px; }
  .srcItem.off { color:#6b5f4d; border-color:#3a3126; }
  .srcItem.on { background:#5a4a30; color:#fff; }
</style>
</head>
<body>
<div id="map">
  <canvas id="gl"></canvas>
</div>
<div id="controls">
  <button id="btn_vec" onclick="setBase('vec')">矢量</button>
  <button id="btn_img" onclick="setBase('img')">影像</button>
  <button id="btn_ter" class="active" onclick="setBase('ter')">地形</button>
  <button id="btn_3d" onclick="toggle3D()">3D 地形</button>
  <button onclick="rotateBearing(-15)">⟲ 旋转</button>
  <button onclick="rotateBearing(15)">⟳ 旋转</button>
  <button onclick="zoomIn()">放大 +</button>
  <button onclick="zoomOut()">缩小 −</button>
  <button onclick="pitchStep(-10)">俯仰 −</button>
  <button onclick="pitchStep(10)">俯仰 +</button>
  <div id="pitchWrap"><input id="pitchRange" type="range" min="0" max="60" step="1" value="45" oninput="setPitch(this.value)"></div>
  <button onclick="openSources()">底图源</button>
  <button id="btn_needle" class="active" onclick="toggleNeedle()">指针</button>
  <button id="btn_sit" onclick="toggleSitNorth()">坐南朝北</button>
  <button id="btn_contour" onclick="toggleContour()">等高线</button>
  <button id="btn_ground" onclick="toggleGround()">贴地</button>
  <button onclick="toggleFullScreen()">全屏</button>
  <button onclick="clearMarkers()">清除标记</button>
  <button onclick="locate()">定位</button>
</div>
<div id="hud"></div>
<button id="fsExit" onclick="toggleFullScreen()">退出全屏</button>
<div id="srcInfo">底图：天地图地形 · 审图号：未确认</div>
<div id="srcPanel"><div class="box"><h3>底图源</h3>
  <div class="srchint">原版 12 源；无 key 的置灰（D-006），审图号须按源官方核对</div>
  <div id="srcBox"></div>
  <button class="srcItem" onclick="closeSources()">关闭</button>
</div></div>
<div id="hint">天地图 · 拖动平移，按钮缩放 · 罗盘指针显示坐向</div>
<div id="needle"></div>
<div id="heading-label">向 0°</div>

<script>
/* ============================================================
 * 山水罗盘 · map.html
 * 2D：天地图 WMTS 瓦片（原逻辑保留）
 * 3D：WebGL 真高程地形（DEM = AWS Terrain Tiles / Terrarium）
 *     + 天地图底图贴面 + 俯仰 0–60° + 旋转 + 罗盘坐向指针
 * 桥接口：见 docs/map-bridge.md
 * ============================================================ */

/* ---------------- 公共状态 ---------------- */
var KEY = "dd18858b33229f5837ad1d97b8d3105e";
var SUB = ["t0","t1","t2","t3","t4","t5","t6","t7"];
var base = "ter";              // vec=矢量 img=影像 ter=地形(默认)
var anno = "cta";              // 注记层
var mode = "2d";               // 2d | 3d
var bearing = 0;               // 地图旋转角
var pitch = 45;                // 3D 俯仰 0(俯视)–60°
var center = { lat: 39.9042, lng: 116.4074 };   // 北京
var zoom = 5;
var lastHeading = 0;
var needleOn = true;           // 指针开关（原版右侧「指针开关」）
/* 坐向对齐（原版 F5：单按钮双标签，g.x() 布尔驱动文案）
 * 0=关 1=坐南朝北(向朝上, bearing=heading) 2=坐北朝南(坐朝上, bearing=heading+180)
 * 第二态几何为等价替代，原版未取证 */
var sitMode = 0;
var bearingBeforeSit = 0;
var contourOn = false;         // 等高线（3D 高程着色叠加）
var groundMode = false;        // 贴地：低机位 + 高俯仰
var pitchBeforeGround = 45;
var drape = "img";             // 3D 贴面层（D-005：默认影像；ter 仍可用按钮切）
var pick = null;               // 3D 立向点 {lng,lat,elev,world,heading}
var pickEl = null;
var lastVP = null, lastD = 0, lastR = 0;

var mapEl = document.getElementById("map");
var glCanvas = document.getElementById("gl");
var hudEl = document.getElementById("hud");
var baseLayer = document.createElement("div");
var annoLayer = document.createElement("div");
baseLayer.style.position = "absolute";
annoLayer.style.position = "absolute";
mapEl.appendChild(baseLayer);
mapEl.appendChild(annoLayer);

/* ---------------- 2D 瓦片 ---------------- */
function tileUrl(layer, z, x, y) {
  var s = SUB[(((x + y) % 8) + 8) % 8];
  return "https://" + s + ".tianditu.gov.cn/" + layer + "_w/wmts" +
    "?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=" + layer +
    "&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles" +
    "&TILEMATRIX=" + z + "&TILEROW=" + y + "&TILECOL=" + x + "&tk=" + KEY;
}

function lonLatToTile(lng, lat, z) {
  var n = Math.pow(2, z);
  var x = (lng + 180) / 360 * n;
  var latRad = lat * Math.PI / 180;
  var y = (1 - Math.log(Math.tan(latRad) + 1 / Math.cos(latRad)) / Math.PI) / 2 * n;
  return { x: x, y: y };
}

function tileYToLat(y, z) {
  var n = Math.PI - 2 * Math.PI * y / Math.pow(2, z);
  return 180 / Math.PI * Math.atan(Math.sinh(n));
}

function render() {
  if (mode === "3d") return;
  var n = Math.pow(2, zoom);
  var c = lonLatToTile(center.lng, center.lat, zoom);
  var w = mapEl.clientWidth, h = mapEl.clientHeight;
  var tx = c.x * 256 - w / 2;
  var ty = c.y * 256 - h / 2;
  var x0 = Math.floor(tx / 256), x1 = Math.ceil((tx + w) / 256);
  var y0 = Math.floor(ty / 256), y1 = Math.ceil((ty + h) / 256);

  fillLayer(baseLayer, base, x0, x1, y0, y1, tx, ty, n);
  fillLayer(annoLayer, anno, x0, x1, y0, y1, tx, ty, n);
}

function fillLayer(layerEl, layer, x0, x1, y0, y1, tx, ty, n) {
  var html = "";
  for (var y = y0; y <= y1; y++) {
    for (var x = x0; x <= x1; x++) {
      var xx = x, yy = y;
      xx = ((x % n) + n) % n;
      if (yy < 0 || yy >= n) continue;
      var left = x * 256 - tx;
      var top = y * 256 - ty;
      html += '<img class="tile" style="left:' + left + 'px;top:' + top + 'px;width:256px;height:256px" ' +
        'src="' + tileUrl(layer, zoom, xx, yy) + '" onerror="this.style.display=\'none\'">';
    }
  }
  layerEl.innerHTML = html;
}

function setBase(b) {
  base = b;
  anno = (b === "img") ? "cia" : (b === "ter" ? "cta" : "cva");
  document.getElementById("btn_vec").className = (b === "vec") ? "active" : "";
  document.getElementById("btn_img").className = (b === "img") ? "active" : "";
  document.getElementById("btn_ter").className = (b === "ter") ? "active" : "";
  if (mode === "3d") {
    drape = b;
    refreshPatchTexture();
    updateHud();
  } else {
    render();
  }
  updateSrcInfo();
}

/* ---------------- 模式 / 视角 ---------------- */
function toggle3D() {
  setMode(mode === "3d" ? "2d" : "3d");
}

function setMode(m) {
  mode = (m === "3d") ? "3d" : "2d";
  var btn = document.getElementById("btn_3d");
  btn.className = (mode === "3d") ? "active" : "";
  btn.textContent = (mode === "3d") ? "返回 2D" : "3D 地形";
  document.getElementById("pitchWrap").style.display = (mode === "3d") ? "block" : "none";
  hudEl.style.display = (mode === "3d") ? "block" : "none";

  if (mode === "3d") {
    /* 大陆尺度下真高程起伏相对视距过小，进入 3D 时至少落到 z9（见 docs/map-bridge.md） */
    if (zoom < 9) zoom = 9;
    /* D-005：3D 贴面默认影像；用户在 3D 里点「地形」仍可切回 ter */
    drape = (base === "ter") ? "img" : base;
    baseLayer.style.display = "none";
    annoLayer.style.display = "none";
    glCanvas.style.display = "block";
    mapEl.style.transform = "";
    if (!initGL()) {
      console.log("LC3D ERROR webgl-unavailable");
      setHud("WebGL 不可用，已退回 2D");
      setMode("2d");
      return;
    }
    resizeGL();
    ensurePatch();
    startLoop();
    console.log("LC3D mode=3d zoom=" + zoom + " pitch=" + pitch);
  } else {
    stopLoop();
    glCanvas.style.display = "none";
    baseLayer.style.display = "";
    annoLayer.style.display = "";
    applyTransform();
    render();
    console.log("LC3D mode=2d");
  }
}

function applyTransform() {
  if (mode === "3d") { mapEl.style.transform = ""; return; }
  mapEl.style.transform = (bearing === 0) ? "" : "rotateZ(" + bearing + "deg)";
}

function rotateBearing(delta) {
  bearing = (bearing + delta + 360) % 360;
  if (mode === "3d") {
    refreshNeedle();
  } else {
    applyTransform();
  }
  updateHud();
}

function pitchStep(d) {
  if (mode !== "3d") return;
  setPitch(pitch + d);
}

function setPitch(v) {
  pitch = Math.max(0, Math.min(60, Math.round(Number(v) || 0)));
  var r = document.getElementById("pitchRange");
  if (r && Number(r.value) !== pitch) r.value = String(pitch);
  updateHud();
}

function zoomIn() { zoom = Math.min(18, zoom + 1); if (mode === "3d") ensurePatch(); else render(); updateHud(); }
function zoomOut() { zoom = Math.max(2, zoom - 1); if (mode === "3d") ensurePatch(); else render(); updateHud(); }

var fullScreen = false;
function toggleFullScreen() {
  fullScreen = !fullScreen;
  document.getElementById("controls").style.display = fullScreen ? "none" : "";
  document.getElementById("hint").style.display = fullScreen ? "none" : "";
  document.getElementById("srcInfo").style.display = fullScreen ? "none" : "";
  document.getElementById("fsExit").style.display = fullScreen ? "block" : "none";
  try {
    var fr = document.getElementById("fsExit").getBoundingClientRect();
    console.log("LC3D fsExit " + Math.round(fr.left) + "," + Math.round(fr.top) + " " +
      Math.round(fr.width) + "x" + Math.round(fr.height) + " vp=" +
      document.documentElement.clientWidth + "x" + document.documentElement.clientHeight);
  } catch (e) { }
  if (mode === "3d") {
    setTimeout(function () { resizeGL(); }, 60);
  }
}

/* ---- 底图源（原版 12 源；D-006：无 key 置灰；审图号按源绑定，核对前一律「未确认」） ---- */
var MAP_SOURCES = [
  { name: "中科星图", layer: null, note: "需授权" },
  { name: "吉林一号·全球", layer: null, note: "需授权" },
  { name: "吉林一号·全国", layer: null, note: "需授权" },
  { name: "世纪空间卫星", layer: null, note: "原版默认源，需授权（有意差异）" },
  { name: "天地图卫星", layer: "img", review: "未确认" },
  { name: "天地图地图", layer: "vec", review: "未确认" },
  { name: "天地图地形", layer: "ter", review: "未确认" },
  { name: "高德卫星", layer: null, note: "需 key" },
  { name: "高德地图", layer: null, note: "需 key" },
  { name: "腾讯卫星", layer: null, note: "需 key" },
  { name: "腾讯地图", layer: null, note: "需 key" },
  { name: "腾讯地形", layer: null, note: "需 key" }
];
var srcIndex = 6;

function sourceOfBase(layer) {
  for (var i = 0; i < MAP_SOURCES.length; i++) if (MAP_SOURCES[i].layer === layer) return i;
  return -1;
}

function openSources() {
  var box = document.getElementById("srcBox");
  var html = "";
  for (var i = 0; i < MAP_SOURCES.length; i++) {
    var s = MAP_SOURCES[i];
    var cls = (s.layer === null) ? "srcItem off" : ((i === srcIndex) ? "srcItem on" : "srcItem");
    var tail = (s.layer === null) ? (" · " + s.note) : (" · 审图号 " + s.review);
    html += '<button class="' + cls + '"' + (s.layer === null ? " disabled" : "") +
      ' onclick="selectSource(' + i + ')">' + (i + 1) + ". " + s.name + tail + "</button>";
  }
  box.innerHTML = html;
  document.getElementById("srcPanel").style.display = "block";
}

function closeSources() { document.getElementById("srcPanel").style.display = "none"; }

function selectSource(i) {
  var s = MAP_SOURCES[i];
  if (!s || s.layer === null) return;
  srcIndex = i;
  setBase(s.layer);
  closeSources();
}

function updateSrcInfo() {
  var i = sourceOfBase(base);
  if (i >= 0) srcIndex = i;
  var s = MAP_SOURCES[srcIndex] || { name: "天地图地形", review: "未确认" };
  var el = document.getElementById("srcInfo");
  if (el) el.textContent = "底图：" + s.name + " · 审图号：" + (s.review || "未确认");
}

/* ---------------- 罗盘坐向指针 ---------------- */
function setHeading(deg) {
  lastHeading = Number(deg) || 0;
  if (sitMode) {
    /* 地图随向角旋转：向或坐恒朝屏幕上方 */
    var offDeg = (sitMode === 2) ? 180 : 0;
    bearing = (((Math.round(lastHeading) + offDeg) % 360) + 360) % 360;
    if (mode !== "3d") applyTransform();
  }
  refreshNeedle();
  var lbl = document.getElementById("heading-label");
  if (lbl && lbl.getAttribute("data-sit") == null) {
    lbl.textContent = "向 " + (Math.round(lastHeading) % 360) + "°";
  }
}

/* ---- 指针开关 / 坐南朝北 / 等高线 / 贴地 ---- */
function toggleNeedle() {
  needleOn = !needleOn;
  var el = document.getElementById("needle");
  if (el) el.style.display = needleOn ? "" : "none";
  document.getElementById("btn_needle").className = needleOn ? "active" : "";
}

function applySit() {
  if (sitMode === 0) {
    bearing = bearingBeforeSit;
  } else {
    var offDeg = (sitMode === 2) ? 180 : 0;
    bearing = (((Math.round(lastHeading) + offDeg) % 360) + 360) % 360;
  }
  var btn = document.getElementById("btn_sit");
  if (btn) {
    btn.textContent = (sitMode === 2) ? "坐北朝南" : "坐南朝北";
    btn.className = sitMode ? "active" : "";
  }
  refreshNeedle();
  if (mode === "3d") updateHud(); else applyTransform();
}

function toggleSitNorth() {
  if (sitMode === 0) { bearingBeforeSit = bearing; sitMode = 1; }
  else if (sitMode === 1) { sitMode = 2; }
  else { sitMode = 0; }
  applySit();
}

function toggleContour() {
  contourOn = !contourOn;
  document.getElementById("btn_contour").className = contourOn ? "active" : "";
  if (mode !== "3d" && contourOn) setMode("3d");   // 等高线依赖 DEM 网格，仅 3D 生效
}

function toggleGround() {
  groundMode = !groundMode;
  document.getElementById("btn_ground").className = groundMode ? "active" : "";
  if (groundMode) {
    pitchBeforeGround = pitch;
    if (mode !== "3d") setMode("3d");
    setPitch(60);
  } else {
    setPitch(pitchBeforeGround);
  }
  updateHud();
}

function refreshNeedle() {
  var el = document.getElementById("needle");
  if (!el) return;
  /* 3D 下地图随 bearing 旋转，指针取 heading-bearing 才与屏幕北对齐 */
  var deg = (mode === "3d") ? (lastHeading - bearing) : lastHeading;
  el.style.transform = "rotate(" + deg + "deg)";
}

function setSitFace(face, sit) {
  var lbl = document.getElementById("heading-label");
  if (!lbl) return;
  lbl.setAttribute("data-sit", "1");
  lbl.textContent = "向 " + face + " · 坐 " + sit;
}

/* ---------------- 拖拽 / 缩放 / 标记 ---------------- */
var dragging = false, lastX = 0, lastY = 0, totalMove = 0;
var lastTouchTs = 0;          // 触摸后合成的鼠标事件去重，避免一次点选发两次 pick

function pan(dxPx, dyPx) {
  if (mode === "3d") { pan3D(dxPx, dyPx); return; }
  var n = Math.pow(2, zoom);
  var c = lonLatToTile(center.lng, center.lat, zoom);
  c.x -= dxPx / 256;
  c.y -= dyPx / 256;
  center.lng = c.x / n * 360 - 180;
  var latRad = Math.atan(Math.sinh(Math.PI * (1 - 2 * c.y / n)));
  center.lat = latRad * 180 / Math.PI;
  render();
}

mapEl.addEventListener("mousedown", function (e) {
  dragging = true; lastX = e.clientX; lastY = e.clientY; totalMove = 0;
});
window.addEventListener("mousemove", function (e) {
  if (!dragging) return;
  totalMove += Math.abs(e.clientX - lastX) + Math.abs(e.clientY - lastY);
  pan(lastX - e.clientX, lastY - e.clientY);
  lastX = e.clientX; lastY = e.clientY;
});
window.addEventListener("mouseup", function () {
  if (Date.now() - lastTouchTs < 800) { dragging = false; return; }
  if (dragging && totalMove < 6) placeMarker(lastX, lastY);
  dragging = false;
});
mapEl.addEventListener("wheel", function (e) {
  e.preventDefault();
  if (e.deltaY < 0) zoomIn(); else zoomOut();
});

function placeMarker(x, y) {
  if (mode === "3d") { pick3D(x, y); return; }
  var rect = mapEl.getBoundingClientRect();
  var mk = document.createElement("div");
  mk.className = "marker";
  mk.style.left = (x - rect.left) + "px";
  mk.style.top = (y - rect.top) + "px";
  var lbl = document.getElementById("heading-label");
  mk.title = "立向点 " + (lbl ? lbl.textContent : "");
  mapEl.appendChild(mk);
}

function clearMarkers() {
  var ms = mapEl.querySelectorAll(".marker");
  for (var i = 0; i < ms.length; i++) ms[i].remove();
  pickEl = null;                 /* 元素已被 remove，重新创建 */
  clearPick();
  emit({ type: "pick-clear" });
}

function locate() {
  if (!navigator.geolocation) { alert("此设备不支持定位"); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    center = { lat: pos.coords.latitude, lng: pos.coords.longitude };
    zoom = Math.max(zoom, 12);
    if (mode === "3d") ensurePatch(true); else render();
    updateHud();
  }, function (err) {
    alert("定位失败: " + err.message);
  }, { enableHighAccuracy: true, timeout: 10000 });
}

/* Touch */
var touchStart = null;
mapEl.addEventListener("touchstart", function (e) {
  if (e.touches.length === 1) {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, moved: 0 };
  }
}, { passive: true });
mapEl.addEventListener("touchmove", function (e) {
  if (e.touches.length === 1 && touchStart) {
    var dx = e.touches[0].clientX - touchStart.x;
    var dy = e.touches[0].clientY - touchStart.y;
    touchStart.x = e.touches[0].clientX;
    touchStart.y = e.touches[0].clientY;
    touchStart.moved += Math.abs(dx) + Math.abs(dy);
    pan(-dx, -dy);
  }
}, { passive: true });
mapEl.addEventListener("touchend", function () {
  lastTouchTs = Date.now();

/* ============================================================
 * 3D 引擎
 * ============================================================ */
var TERRARIUM = "https://s3.amazonaws.com/elevation-tiles-prod/terrarium/";
var PATCH_TILES = 3;                 // 每块地形 3×3 个 DEM 瓦片
var PATCH_PX = PATCH_TILES * 256;    // 768
var GRID = 96;                       // 网格 96×96 顶点
var VEXAG = 2.5;                     // 垂直放大（真实高程 × 2.5，见文档）
var FOV = 50 * Math.PI / 180;

var gl = null, prog = null, loc = {}, buffers = null, placeholderTex = null;
var patch = null, patchSeq = 0, loadingKey = null;
var rafId = 0, fpsFrames = 0, fpsT = 0, fps = 0, hudT = 0, logT = 0;
var visible3D = true;
var demoElev = 0;

/* ---- DEM 缓存 ---- */
var DEM = {}, DEM_PENDING = {}, DEM_ORDER = [];

function wrapX(x, n) { return ((x % n) + n) % n; }

function demTile(z, x, y) {
  var k = z + "/" + x + "/" + y;
  if (DEM[k]) return Promise.resolve(DEM[k]);
  if (DEM_PENDING[k]) return DEM_PENDING[k];
  var p = new Promise(function (resolve, reject) {
    var tries = 0;
    function attempt() {
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function () {
        try {
          var cv = document.createElement("canvas");
          cv.width = 256; cv.height = 256;
          var ctx = cv.getContext("2d");
          ctx.drawImage(img, 0, 0);
          var d = ctx.getImageData(0, 0, 256, 256).data;
          var f = new Float32Array(65536);
          for (var i = 0; i < 65536; i++) {
            var o = i * 4;
            f[i] = ((d[o] << 8) | d[o + 1]) + d[o + 2] / 256 - 32768;
          }
          DEM[k] = f; DEM_ORDER.push(k);
          delete DEM_PENDING[k];
          while (DEM_ORDER.length > 90) {
            var old = DEM_ORDER.shift();
            if (!(patch && old.indexOf(patch.z + "/") === 0)) delete DEM[old];
          }
          resolve(f);
        } catch (e) { fail(e); }
      };
      img.onerror = function () { fail(new Error("dem-load")); };
      function fail(e) {
        if (++tries < 2) { setTimeout(attempt, 600); }
        else { delete DEM_PENDING[k]; reject(e); }
      }
      img.src = TERRARIUM + z + "/" + x + "/" + y + ".png";
    }
    attempt();
  });
  DEM_PENDING[k] = p;
  return p;
}

function demPix(z, px, py) {
  var n = Math.pow(2, z);
  if (py < 0 || py >= n * 256) return null;
  var tx = Math.floor(px / 256), ty = Math.floor(py / 256);
  tx = wrapX(tx, n);
  var t = DEM[z + "/" + tx + "/" + ty];
  if (!t) return null;
  return t[(py - ty * 256) * 256 + (px - tx * 256)];
}

function demAt(z, gx, gy) {
  var x0 = Math.floor(gx), y0 = Math.floor(gy);
  var fx = gx - x0, fy = gy - y0;
  var a = demPix(z, x0, y0), b = demPix(z, x0 + 1, y0);
  var c = demPix(z, x0, y0 + 1), d = demPix(z, x0 + 1, y0 + 1);
  if (a === null || b === null || c === null || d === null) return 0;
  return a * (1 - fx) * (1 - fy) + b * fx * (1 - fy) + c * (1 - fx) * fy + d * fx * fy;
}

/* ---- WebGL 初始化 ---- */
function initGL() {
  if (gl) return true;
  try {
    var opts = { alpha: false, antialias: false, depth: true, preserveDrawingBuffer: true };
    gl = glCanvas.getContext("webgl", opts) || glCanvas.getContext("experimental-webgl", opts);
  } catch (e) { gl = null; }
  if (!gl) return false;

  var vs = [
    "attribute vec3 aPos;",
    "attribute vec3 aNrm;",
    "attribute float aElev;",
    "attribute vec2 aUv;",
    "uniform mat4 uVP;",
    "uniform vec3 uTarget;",
    "varying vec3 vNrm;",
    "varying float vElev;",
    "varying vec2 vUv;",
    "varying float vDist;",
    "void main(){",
    "  vNrm = aNrm; vElev = aElev; vUv = aUv;",
    "  vDist = length(aPos.xz - uTarget.xz);",
    "  gl_Position = uVP * vec4(aPos, 1.0);",
    "}"
  ].join("\n");

  var fs = [
    "#extension GL_OES_standard_derivatives : enable",
    "precision mediump float;",
    "precision mediump sampler2D;",
    "varying vec3 vNrm;",
    "varying float vElev;",
    "varying vec2 vUv;",
    "varying float vDist;",
    "uniform sampler2D uTex;",
    "uniform float uUseTex;",
    "uniform vec3 uLight;",
    "uniform vec3 uFog;",
    "uniform float uFogNear;",
    "uniform float uFogFar;",
    "uniform float uContour;",
    "vec3 hypo(float e){",
    "  if (e < 1.0) return vec3(0.10, 0.22, 0.34);",
    "  if (e < 200.0) return mix(vec3(0.16, 0.32, 0.19), vec3(0.32, 0.48, 0.24), e / 200.0);",
    "  if (e < 900.0) return mix(vec3(0.32, 0.48, 0.24), vec3(0.58, 0.55, 0.31), (e - 200.0) / 700.0);",
    "  if (e < 1800.0) return mix(vec3(0.58, 0.55, 0.31), vec3(0.62, 0.52, 0.42), (e - 900.0) / 900.0);",
    "  if (e < 3000.0) return mix(vec3(0.62, 0.52, 0.42), vec3(0.84, 0.82, 0.78), (e - 1800.0) / 1200.0);",
    "  return vec3(0.95, 0.95, 0.97);",
    "}",
    "void main(){",
    "  vec3 n = normalize(vNrm);",
    "  float sh = 0.55 + 0.55 * clamp(dot(n, uLight), 0.0, 1.0);",
    "  vec3 col = hypo(vElev);",
    "  if (uUseTex > 0.5) {",
    "    vec3 t = texture2D(uTex, vUv).rgb;",
    "    col = mix(col, t, 0.88);",
    "  }",
    "  col *= sh;",
    "  if (uContour > 0.5) {",
    "    float v = vElev / 100.0;",
    "    float f100 = fract(v);",
    "    float d100 = min(f100, 1.0 - f100);",
    "    float v5 = vElev / 500.0;",
    "    float f500 = fract(v5);",
    "    float d500 = min(f500, 1.0 - f500);",
    "#ifdef GL_OES_standard_derivatives",
    "    float w100 = fwidth(v) * 3.0;",
    "    float w500 = fwidth(v5) * 3.0;",
    "#else",
    "    float w100 = 0.03;",
    "    float w500 = 0.02;",
    "#endif",
    "    float line100 = 1.0 - smoothstep(0.0, max(w100, 0.004), d100);",
    "    float line500 = 1.0 - smoothstep(0.0, max(w500, 0.004), d500);",
    "    col = mix(col, vec3(0.12, 0.09, 0.05), line100 * 0.68 + line500 * 0.55);",
    "  }",
    "  float f = clamp((vDist - uFogNear) / max(1.0, uFogFar - uFogNear), 0.0, 1.0);",
    "  col = mix(col, uFog, f * 0.9);",
    "  gl_FragColor = vec4(col, 1.0);",
    "}"
  ].join("\n");

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      throw new Error(gl.getShaderInfoLog(s) || "shader");
    }
    return s;
  }

  try {
    prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      throw new Error(gl.getProgramInfoLog(prog) || "link");
    }
  } catch (e) {
    console.log("LC3D ERROR shader " + e.message);
    gl = null;
    return false;
  }

  loc = {
    pos: gl.getAttribLocation(prog, "aPos"),
    nrm: gl.getAttribLocation(prog, "aNrm"),
    elev: gl.getAttribLocation(prog, "aElev"),
    uv: gl.getAttribLocation(prog, "aUv"),
    vp: gl.getUniformLocation(prog, "uVP"),
    target: gl.getUniformLocation(prog, "uTarget"),
    tex: gl.getUniformLocation(prog, "uTex"),
    useTex: gl.getUniformLocation(prog, "uUseTex"),
    light: gl.getUniformLocation(prog, "uLight"),
    fog: gl.getUniformLocation(prog, "uFog"),
    fogNear: gl.getUniformLocation(prog, "uFogNear"),
    fogFar: gl.getUniformLocation(prog, "uFogFar"),
    contour: gl.getUniformLocation(prog, "uContour")
  };

  buffers = {
    pos: gl.createBuffer(), nrm: gl.createBuffer(),
    elev: gl.createBuffer(), uv: gl.createBuffer(), idx: gl.createBuffer()
  };
  /* 1×1 占位纹理：避免 uUseTex=0 时驱动报 "no texture bound" */
  placeholderTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, placeholderTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([58, 74, 52, 255]));
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  console.log("LC3D contourLoc=" + (loc.contour !== null) + " deriv=" +
    !!(gl.getExtension("OES_standard_derivatives")));
  gl.enable(gl.DEPTH_TEST);
  gl.disable(gl.CULL_FACE);
  gl.clearColor(0.47, 0.55, 0.62, 1.0);
  console.log("LC3D webgl ok " + gl.getParameter(gl.VERSION));
  return true;
}

function resizeGL() {
  var dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  var w = Math.max(1, Math.round(glCanvas.clientWidth * dpr));
  var h = Math.max(1, Math.round(glCanvas.clientHeight * dpr));
  if (glCanvas.width !== w || glCanvas.height !== h) {
    glCanvas.width = w;
    glCanvas.height = h;
  }
  if (gl) gl.viewport(0, 0, w, h);
}

/* ---- 地形块 ---- */
function ensurePatch(force) {
  if (mode !== "3d") return;
  var zdem = Math.max(4, Math.min(12, Math.round(zoom) - 1));
  var t = lonLatToTile(center.lng, center.lat, zdem);
  var ox = Math.floor(t.x) - 1, oy = Math.floor(t.y) - 1;
  if (!force && patch && patch.z === zdem &&
      Math.abs(t.x - (patch.ox + 1.5)) <= 0.6 &&
      Math.abs(t.y - (patch.oy + 1.5)) <= 0.6) {
    return;
  }
  startPatch(zdem, ox, oy);
}

function startPatch(z, ox, oy) {
  var key = z + "/" + ox + "/" + oy;
  if (loadingKey === key) return;
  loadingKey = key;
  var seq = ++patchSeq;
  var n = Math.pow(2, z);
  var jobs = [];
  for (var j = 0; j < PATCH_TILES; j++) {
    for (var i = 0; i < PATCH_TILES; i++) {
      var x = wrapX(ox + i, n), y = oy + j;
      if (y < 0 || y >= n) { jobs.push(Promise.resolve(null)); continue; }
      jobs.push(demTile(z, x, y).catch(function () { return null; }));
    }
  }
  setHud("DEM 加载中…");
  Promise.all(jobs).then(function (tiles) {
    if (seq !== patchSeq) return;
    for (var i = 0; i < tiles.length; i++) {
      if (!tiles[i]) {
        console.log("LC3D ERROR dem-missing");
        setHud("DEM 加载失败");
        loadingKey = null;
        return;
      }
    }
    var mpp = 156543.03392 * Math.cos(tileYToLat(oy + 1.5, z) * Math.PI / 180) / Math.pow(2, z);
    var p = { z: z, ox: ox, oy: oy, mpp: mpp, mesh: null, tex: null, texCanvas: null, indexCount: 0 };
    try {
      p.mesh = buildMesh(p);
      uploadMesh(p);
      patch = p;
      loadingKey = null;
      console.log("LC3D patch " + z + "/" + ox + "/" + oy + " mpp=" + mpp.toFixed(1) + " verts=" + ((GRID + 1) * (GRID + 1)));
      buildPatchTexture(p);
      updateHud();
    } catch (e) {
      console.log("LC3D ERROR mesh " + e.message);
      setHud("地形构建失败");
      loadingKey = null;
    }
  }, function () {
    if (seq !== patchSeq) return;
    console.log("LC3D ERROR dem-load");
    setHud("DEM 加载失败");
    loadingKey = null;
  });
}

function buildMesh(p) {
  var N = GRID, step = PATCH_PX / N;
  var vc = (N + 1) * (N + 1);
  var pos = new Float32Array(vc * 3);
  var nrm = new Float32Array(vc * 3);
  var elev = new Float32Array(vc);
  var uv = new Float32Array(vc * 2);
  var H = new Float32Array(vc);
  var i, j;
  for (j = 0; j <= N; j++) {
    for (i = 0; i <= N; i++) {
      H[j * (N + 1) + i] = demAt(p.z, p.ox * 256 + i * step, p.oy * 256 + j * step);
    }
  }
  var dx = step * p.mpp;
  for (j = 0; j <= N; j++) {
    for (i = 0; i <= N; i++) {
      var k = j * (N + 1) + i;
      var h = H[k] * VEXAG;
      var hl = H[j * (N + 1) + Math.max(0, i - 1)] * VEXAG;
      var hr = H[j * (N + 1) + Math.min(N, i + 1)] * VEXAG;
      var hu = H[Math.max(0, j - 1) * (N + 1) + i] * VEXAG;
      var hd = H[Math.min(N, j + 1) * (N + 1) + i] * VEXAG;
      var sx = (hr - hl) / (2 * dx);
      var sz = (hd - hu) / (2 * dx);
      var nx = -sx, ny = 1, nz = -sz;
      var len = Math.sqrt(nx * nx + ny * ny + nz * nz) || 1;
      pos[k * 3] = (i * step - PATCH_PX / 2) * p.mpp;
      pos[k * 3 + 1] = h;
      pos[k * 3 + 2] = (j * step - PATCH_PX / 2) * p.mpp;
      nrm[k * 3] = nx / len; nrm[k * 3 + 1] = ny / len; nrm[k * 3 + 2] = nz / len;
      elev[k] = H[k];
      /* 贴面纹理比 DEM 高一级（6×6 瓦片 1536px 正好覆盖整块），UV 与屏幕 1:1 */
      uv[k * 2] = i * step / PATCH_PX;
      uv[k * 2 + 1] = j * step / PATCH_PX;
    }
  }
  var idx = new Uint16Array(N * N * 6);
  var q = 0;
  for (j = 0; j < N; j++) {
    for (i = 0; i < N; i++) {
      var a = j * (N + 1) + i, b = a + 1, c = a + N + 1, d = c + 1;
      idx[q++] = a; idx[q++] = c; idx[q++] = b;
      idx[q++] = b; idx[q++] = c; idx[q++] = d;
    }
  }
  return { pos: pos, nrm: nrm, elev: elev, uv: uv, idx: idx, count: idx.length };
}

function uploadMesh(p) {
  var m = p.mesh;
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.pos); gl.bufferData(gl.ARRAY_BUFFER, m.pos, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nrm); gl.bufferData(gl.ARRAY_BUFFER, m.nrm, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.elev); gl.bufferData(gl.ARRAY_BUFFER, m.elev, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.uv); gl.bufferData(gl.ARRAY_BUFFER, m.uv, gl.STATIC_DRAW);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.idx); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, m.idx, gl.STATIC_DRAW);
  p.indexCount = m.count;
}

/* 天地图底图贴面（3×3 瓦片拼成 768×768 纹理） */
function buildPatchTexture(p) {
  var seq = patchSeq;
  var TEX_TILES = 6, TEX_PX = 2048;              // POT 画布，才能开 mipmap
  var cell = TEX_PX / TEX_TILES;                 // 341.33px/瓦片，1.33× 上采样换 mipmap
  var zt = Math.min(p.z + 1, 18);                // 比 DEM 高一级
  var tx0 = p.ox * 2, ty0 = p.oy * 2;            // 该级别下地形块的左上瓦片
  var cv = document.createElement("canvas");
  cv.width = TEX_PX; cv.height = TEX_PX;
  var ctx = cv.getContext("2d");
  ctx.fillStyle = "#3a4a34";
  ctx.fillRect(0, 0, TEX_PX, TEX_PX);
  var n = Math.pow(2, zt), ok = 0, tasks = [];
  for (var j = 0; j < TEX_TILES; j++) {
    for (var i = 0; i < TEX_TILES; i++) {
      (function (i, j) {
        var x = wrapX(tx0 + i, n), y = ty0 + j;
        if (y < 0 || y >= n) return;
        tasks.push(new Promise(function (res) {
          var img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function () { ctx.drawImage(img, i * cell, j * cell, cell, cell); ok++; res(); };
          img.onerror = function () { res(); };
          img.src = tileUrl(drape, zt, x, y);
        }));
      })(i, j);
    }
  }
  Promise.all(tasks).then(function () {
    if (seq !== patchSeq || patch !== p) return;
    if (ok >= 30) { p.texCanvas = cv; console.log("LC3D texture ok " + ok + "/36 " + drape + " z" + zt); }
    else { console.log("LC3D texture fail " + ok + "/36 " + drape + " z" + zt); }
  });
}

function refreshPatchTexture() {
  if (!patch) return;
  if (patch.tex) { gl.deleteTexture(patch.tex); patch.tex = null; }
  patch.texCanvas = null;
  buildPatchTexture(patch);
}

function uploadTexture(p) {
  if (p.texCanvas) {
    var t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, p.texCanvas);
    gl.generateMipmap(gl.TEXTURE_2D);              /* POT 纹理：三线性 + 远距抗锯齿 */
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    /* 斜视方向用各向异性过滤，减轻贴面模糊/条纹（不支持则忽略） */
    var ext = gl.getExtension("EXT_texture_filter_anisotropic") ||
              gl.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
    if (ext) {
      var maxA = gl.getParameter(ext.MAX_TEXTURE_MAX_ANISOTROPY_EXT);
      gl.texParameterf(gl.TEXTURE_2D, ext.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(4, maxA));
    }
    p.tex = t;
    p.texCanvas = null;
  }
}

/* ---- 相机 / 矩阵 ---- */
function sub(a, b) { return { x: a.x - b.x, y: a.y - b.y, z: a.z - b.z }; }
function cross(a, b) {
  return { x: a.y * b.z - a.z * b.y, y: a.z * b.x - a.x * b.z, z: a.x * b.y - a.y * b.x };
}
function norm(a) {
  var l = Math.sqrt(a.x * a.x + a.y * a.y + a.z * a.z) || 1;
  return { x: a.x / l, y: a.y / l, z: a.z / l };
}
function dot(a, b) { return a.x * b.x + a.y * b.y + a.z * b.z; }

function lookAt(eye, target, up) {
  var f = norm(sub(target, eye));
  var s = norm(cross(f, up));
  var u = cross(s, f);
  return [
    s.x, u.x, -f.x, 0,
    s.y, u.y, -f.y, 0,
    s.z, u.z, -f.z, 0,
    -dot(s, eye), -dot(u, eye), dot(f, eye), 1
  ];
}

function perspective(fovy, aspect, near, far) {
  var f = 1 / Math.tan(fovy / 2);
  return [
    f / aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far + near) / (near - far), -1,
    0, 0, 2 * far * near / (near - far), 0
  ];
}

function mul(a, b) {
  var o = new Array(16);
  for (var c = 0; c < 4; c++) {
    for (var r = 0; r < 4; r++) {
      o[c * 4 + r] = a[r] * b[c * 4] + a[4 + r] * b[c * 4 + 1] +
        a[8 + r] * b[c * 4 + 2] + a[12 + r] * b[c * 4 + 3];
    }
  }
  return o;
}

function pan3D(dx, dy) {
  if (!patch) return;
  var w = Math.max(1, glCanvas.clientWidth), h = Math.max(1, glCanvas.clientHeight);
  var zMpp = 156543.03392 * Math.cos(center.lat * Math.PI / 180) / Math.pow(2, zoom);
  var D = (h * zMpp) / (2 * Math.tan(FOV / 2));
  var g = (2 * D * Math.tan(FOV / 2)) / h;   // 屏幕 1px 对应的地面米数
  var b = bearing * Math.PI / 180;
  var fx = Math.sin(b), fz = -Math.cos(b);
  var rx = Math.cos(b), rz = Math.sin(b);
  /* 拖拽语义：手指向右=看西侧（中心西移），手指向下=看北侧（中心北移） */
  var mx = rx * dx * g - fx * dy * g;        // 东向
  var mz = rz * dx * g - fz * dy * g;        // 南向
  center.lng += mx / (111320 * Math.cos(center.lat * Math.PI / 180));
  center.lat -= mz / 110540;
  if (center.lat > 85) center.lat = 85;
  if (center.lat < -85) center.lat = -85;
  ensurePatch();
  updateHud();
}

/* ---- 3D 点选（P0-4 / D-005） ----------------------------------------------
 * 屏幕点 → 反投影射线 → 与 DEM 高度场步进求交 → 经纬度/真实海拔 → 立向点
 * 高程缺失时传 null（绝不传 0）；单点覆盖式；不联动罗盘（D-006）
 * ------------------------------------------------------------------------ */
function emit(obj) {
  try {
    if (window.LCAndroid && typeof window.LCAndroid.onEvent === "function") {
      window.LCAndroid.onEvent(JSON.stringify(obj));
    }
  } catch (e) { /* 桥未接入时静默 */ }
}

function ensurePickEl() {
  if (pickEl) return pickEl;
  pickEl = document.createElement("div");
  pickEl.className = "marker pick3d";
  pickEl.style.display = "none";
  mapEl.appendChild(pickEl);
  return pickEl;
}

function mulMatVec(m, v) {
  return [
    m[0] * v[0] + m[4] * v[1] + m[8] * v[2] + m[12] * v[3],
    m[1] * v[0] + m[5] * v[1] + m[9] * v[2] + m[13] * v[3],
    m[2] * v[0] + m[6] * v[1] + m[10] * v[2] + m[14] * v[3],
    m[3] * v[0] + m[7] * v[1] + m[11] * v[2] + m[15] * v[3]
  ];
}

function invertMat(m) {
  var a00 = m[0], a01 = m[1], a02 = m[2], a03 = m[3];
  var a10 = m[4], a11 = m[5], a12 = m[6], a13 = m[7];
  var a20 = m[8], a21 = m[9], a22 = m[10], a23 = m[11];
  var a30 = m[12], a31 = m[13], a32 = m[14], a33 = m[15];
  var b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10;
  var b02 = a00 * a13 - a03 * a10, b03 = a01 * a12 - a02 * a11;
  var b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
  var b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30;
  var b08 = a20 * a33 - a23 * a30, b09 = a21 * a32 - a22 * a31;
  var b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
  var det = b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06;
  if (!det) return null;
  det = 1 / det;
  return [
    (a11 * b11 - a12 * b10 + a13 * b09) * det,
    (a02 * b10 - a01 * b11 - a03 * b09) * det,
    (a31 * b05 - a32 * b04 + a33 * b03) * det,
    (a22 * b04 - a21 * b05 - a23 * b03) * det,
    (a12 * b08 - a10 * b11 - a13 * b07) * det,
    (a00 * b11 - a02 * b08 + a03 * b07) * det,
    (a32 * b02 - a30 * b05 - a33 * b01) * det,
    (a20 * b05 - a22 * b02 + a23 * b01) * det,
    (a10 * b10 - a11 * b08 + a13 * b06) * det,
    (a01 * b08 - a00 * b10 - a03 * b06) * det,
    (a30 * b04 - a31 * b02 + a33 * b00) * det,
    (a21 * b02 - a20 * b04 - a23 * b00) * det,
    (a11 * b07 - a10 * b09 - a12 * b06) * det,
    (a00 * b09 - a01 * b07 + a02 * b06) * det,
    (a31 * b01 - a30 * b03 - a32 * b00) * det,
    (a20 * b03 - a21 * b01 + a22 * b00) * det
  ];
}

function screenRay(sx, sy) {
  var w = Math.max(1, glCanvas.clientWidth), h = Math.max(1, glCanvas.clientHeight);
  var x = sx / w * 2 - 1, y = 1 - sy / h * 2;
  var inv = invertMat(lastVP);
  if (!inv) return null;
  var n = mulMatVec(inv, [x, y, -1, 1]);
  var f = mulMatVec(inv, [x, y, 1, 1]);
  if (Math.abs(n[3]) < 1e-9 || Math.abs(f[3]) < 1e-9) return null;
  var p0 = { x: n[0] / n[3], y: n[1] / n[3], z: n[2] / n[3] };
  var p1 = { x: f[0] / f[3], y: f[1] / f[3], z: f[2] / f[3] };
  return { o: p0, d: norm(sub(p1, p0)) };
}

function worldToDem(x, z) {
  if (!patch) return null;
  var gx = x / patch.mpp + (patch.ox + 1.5) * 256;
  var gy = z / patch.mpp + (patch.oy + 1.5) * 256;
  if (gx < patch.ox * 256 || gx > (patch.ox + 3) * 256) return null;
  if (gy < patch.oy * 256 || gy > (patch.oy + 3) * 256) return null;
  return { gx: gx, gy: gy };
}

function pick3D(sx, sy) {
  if (!patch || !patch.mesh || !lastVP) return;
  var ray = screenRay(sx, sy);
  if (!ray) return;
  var maxT = lastD * 4;
  var step = Math.max(15, patch.mpp * 1.5);
  var above = -1, below = -1, t;
  for (t = 0; t <= maxT; t += step) {
    var px = ray.o.x + ray.d.x * t;
    var py = ray.o.y + ray.d.y * t;
    var pz = ray.o.z + ray.d.z * t;
    var g = worldToDem(px, pz);
    if (!g) continue;
    var hh = demAt(patch.z, g.gx, g.gy) * VEXAG;
    if (py > hh) { above = t; }
    else { below = t; if (above < 0) above = 0; break; }
  }
  if (below < 0) { console.log("LC3D pick miss"); return; }
  for (var i = 0; i < 24; i++) {
    var tm = (above + below) / 2;
    var mx = ray.o.x + ray.d.x * tm;
    var my = ray.o.y + ray.d.y * tm;
    var mz = ray.o.z + ray.d.z * tm;
    var gm = worldToDem(mx, mz);
    if (!gm) break;
    var hm = demAt(patch.z, gm.gx, gm.gy) * VEXAG;
    if (my > hm) above = tm; else below = tm;
  }
  var th = (above + below) / 2;
  var hx = ray.o.x + ray.d.x * th;
  var hy = ray.o.y + ray.d.y * th;
  var hz = ray.o.z + ray.d.z * th;
  var gh = worldToDem(hx, hz);
  if (!gh) return;
  var elevRaw = demPix(patch.z, Math.floor(gh.gx), Math.floor(gh.gy));
  var elev = (elevRaw === null) ? null : demAt(patch.z, gh.gx, gh.gy);
  var n = Math.pow(2, patch.z);
  var tx = gh.gx / 256, ty = gh.gy / 256;
  var lng = tx / n * 360 - 180;
  var lat = tileYToLat(ty, patch.z);
  pick = {
    lng: lng, lat: lat, elev: elev,
    world: { x: hx, y: (elev === null ? hy : elev * VEXAG), z: hz },
    heading: lastHeading
  };
  updateHud();
  updatePickMarker(lastVP);
  var msg = {
    type: "pick",
    lng: Math.round(lng * 1e6) / 1e6,
    lat: Math.round(lat * 1e6) / 1e6,
    elev: (elev === null) ? null : Math.round(elev * 10) / 10,
    heading: Math.round(lastHeading * 10) / 10,
    src: "3d"
  };
  console.log("LC3D pick " + JSON.stringify(msg));
  emit(msg);
}

function projectPoint(p, vp) {
  var v = mulMatVec(vp, [p.x, p.y, p.z, 1]);
  if (v[3] <= 1e-6) return null;
  return { x: v[0] / v[3], y: v[1] / v[3], z: v[2] / v[3] };
}

function updatePickMarker(vp) {
  var el = ensurePickEl();
  if (!pick || mode !== "3d") { el.style.display = "none"; return; }
  var v = projectPoint(pick.world, vp);
  if (!v || v.z < -1 || v.z > 1) { el.style.display = "none"; return; }
  el.style.display = "block";
  el.style.left = ((v.x * 0.5 + 0.5) * glCanvas.clientWidth) + "px";
  el.style.top = ((0.5 - v.y * 0.5) * glCanvas.clientHeight) + "px";
  el.title = "立向点 海拔 " + (pick.elev === null ? "—" : Math.round(pick.elev) + " m");
}

function clearPick() {
  pick = null;
  if (pickEl) pickEl.style.display = "none";
}

/* ---- 渲染 ---- */
function startLoop() {
  if (rafId) return;
  fpsT = 0; fpsFrames = 0;
  rafId = requestAnimationFrame(loop);
}

function stopLoop() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
  fps = 0;
}

function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!visible3D) return;
  render3D();
  if (!fpsT) fpsT = ts;
  fpsFrames++;
  if (ts - fpsT >= 1000) {
    fps = Math.round(fpsFrames * 1000 / (ts - fpsT));
    fpsFrames = 0; fpsT = ts;
    updateHud();
    if (ts - logT > 5000) {
      logT = ts;
      console.log("LC3D fps=" + fps + " elev=" + Math.round(demoElev) + " pitch=" + pitch +
        " bearing=" + bearing + " zoom=" + zoom + " z=" + (patch ? patch.z : "-"));
    }
  }
}

function render3D() {
  if (!gl) { if (!initGL()) return; }
  if (!patch || !patch.mesh) {
    gl.clearColor(0.47, 0.55, 0.62, 1.0);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    return;
  }
  var W = glCanvas.width, H = glCanvas.height;
  if (!W || !H) return;
  var aspect = W / H;
  var zMpp = 156543.03392 * Math.cos(center.lat * Math.PI / 180) / Math.pow(2, zoom);
  var hCss = Math.max(1, glCanvas.clientHeight);
  var D = (hCss * zMpp) / (2 * Math.tan(FOV / 2));
  if (groundMode) D *= 0.35;          /* 贴地：机位压低到 35%，配合俯仰 60° */

  var t = lonLatToTile(center.lng, center.lat, patch.z);
  var gx = t.x * 256, gy = t.y * 256;
  /* 网格以地形块中心为原点：块中心 = (ox+1.5, oy+1.5) 个瓦片 */
  var cxPx = (patch.ox + 1.5) * 256, cyPx = (patch.oy + 1.5) * 256;
  var target = {
    x: (gx - cxPx) * patch.mpp,
    y: 0,
    z: (gy - cyPx) * patch.mpp
  };
  demoElev = demAt(patch.z, gx, gy);
  target.y = demoElev * VEXAG;

  var b = bearing * Math.PI / 180, p = pitch * Math.PI / 180;
  var fh = { x: Math.sin(b), y: 0, z: -Math.cos(b) };
  var sp = Math.sin(p), cp = Math.cos(p);
  var eye = {
    x: target.x - fh.x * D * sp,
    y: target.y + D * cp,
    z: target.z - fh.z * D * sp
  };
  var up = (pitch < 0.5) ? { x: Math.sin(b), y: 0, z: -Math.cos(b) } : { x: 0, y: 1, z: 0 };
  var view = lookAt(eye, target, up);

  var R = (PATCH_PX / 2) * patch.mpp;                 // 地形块半径（米）
  var near = Math.max(1, D * 0.01);
  var far = Math.max(D * 6, R * 3);
  var vp = mul(perspective(FOV, aspect, near, far), view);
  lastVP = vp; lastD = D; lastR = R;

  gl.viewport(0, 0, W, H);
  gl.clearColor(0.47, 0.55, 0.62, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.useProgram(prog);

  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.pos);
  gl.enableVertexAttribArray(loc.pos);
  gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.nrm);
  gl.enableVertexAttribArray(loc.nrm);
  gl.vertexAttribPointer(loc.nrm, 3, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.elev);
  gl.enableVertexAttribArray(loc.elev);
  gl.vertexAttribPointer(loc.elev, 1, gl.FLOAT, false, 0, 0);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffers.uv);
  gl.enableVertexAttribArray(loc.uv);
  gl.vertexAttribPointer(loc.uv, 2, gl.FLOAT, false, 0, 0);

  if (patch.texCanvas) uploadTexture(patch);

  gl.uniformMatrix4fv(loc.vp, false, new Float32Array(vp));
  gl.uniform3f(loc.target, target.x, target.y, target.z);
  gl.uniform3f(loc.light, -0.45, 0.78, -0.42);
  gl.uniform3f(loc.fog, 0.47, 0.55, 0.62);
  gl.uniform1f(loc.fogNear, R * 0.75);
  gl.uniform1f(loc.fogFar, R * 1.05);
  gl.uniform1f(loc.contour, contourOn ? 1 : 0);
  if (contourOn && !window.__lcDbgContour) {
    window.__lcDbgContour = 1;
    console.log("LC3D contour on=" + contourOn + " uniform=" +
      (loc.contour ? gl.getUniform(prog, loc.contour) : "null") + " elev=" + Math.round(demoElev));
  }
  gl.uniform1f(loc.useTex, patch.tex ? 1 : 0);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, patch.tex || placeholderTex);
  gl.uniform1i(loc.tex, 0);

  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, buffers.idx);
  gl.drawElements(gl.TRIANGLES, patch.indexCount, gl.UNSIGNED_SHORT, 0);

  if (!window.__lcDbgDraw) {
    window.__lcDbgDraw = 1;
    console.log("LC3D draw W=" + W + " H=" + H + " idx=" + patch.indexCount +
      " attr=" + loc.pos + "," + loc.nrm + "," + loc.elev + "," + loc.uv +
      " vp0=" + vp[0].toFixed(3) + " eye=" + Math.round(eye.x) + "," + Math.round(eye.y) + "," + Math.round(eye.z) +
      " tgt=" + Math.round(target.x) + "," + Math.round(target.y) + "," + Math.round(target.z) +
      " D=" + Math.round(D) + " err=" + gl.getError());
  }
  updatePickMarker(vp);
}

/* ---- HUD ---- */
function setHud(t) {
  hudEl.textContent = t;
  hudEl.style.display = (mode === "3d") ? "block" : "none";
}

function updateHud() {
  if (mode !== "3d") { hudEl.style.display = "none"; return; }
  hudEl.style.display = "block";
  if (!patch || !patch.mesh) { hudEl.textContent = "DEM 加载中…"; return; }
  hudEl.textContent =
    "FPS " + fps + "\n" +
    "海拔 " + Math.round(demoElev) + " m\n" +
    "z" + zoom + " · 俯仰 " + pitch + "° · " + (Math.round(bearing) % 360) + "°\n" +
    "垂直放大 " + VEXAG + "× · 贴面 " + (drape === "img" ? "影像" : (drape === "vec" ? "矢量" : "地形")) +
    (pick ? "\n立向点 海拔 " + (pick.elev === null ? "—" : Math.round(pick.elev) + " m") : "");
}

/* ---- 可见性：切到别的 Tab 时停渲染，避免双 WebView 抢 GPU ---- */
if (window.IntersectionObserver) {
  new IntersectionObserver(function (es) {
    visible3D = !!(es[0] && es[0].isIntersecting);
  }, { threshold: 0.01 }).observe(glCanvas);
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "hidden") visible3D = false;
  else visible3D = true;
});

/* ---- 对外 / 测试接口 ---- */
function debugSetView(lat, lng, z, p, b) {
  if (typeof lat === "number") center.lat = lat;
  if (typeof lng === "number") center.lng = lng;
  if (typeof z === "number") zoom = Math.max(2, Math.min(18, z));
  if (typeof p === "number") setPitch(p);
  if (typeof b === "number") bearing = ((b % 360) + 360) % 360;
  if (mode === "3d") { ensurePatch(true); updateHud(); } else { applyTransform(); render(); }
}

/* 文档 §4 承诺的 window 级 API（getState/getFps/setView/sitNorth 以前只在内部作用域，
 * 客户端 js 断言拿不到——这次显式挂到 window，并由 AT TD-016 守住） */
function getState() {
  return {
    mode: mode, lat: center.lat, lng: center.lng, zoom: zoom, pitch: pitch,
    bearing: bearing, fps: fps, elev: Math.round(demoElev),
    demZoom: patch ? patch.z : null, hasTexture: !!(patch && patch.tex),
    sitMode: sitMode, sitNorth: sitMode !== 0,
    contour: contourOn, ground: groundMode, needle: needleOn,
    base: base, drape: drape,
    source: (MAP_SOURCES[srcIndex] ? MAP_SOURCES[srcIndex].name : "")
  };
}
function getFps() { return fps; }
function setView(lat, lng, z) { debugSetView(lat, lng, z, null, null); }
try {
  Object.defineProperty(window, "sitNorth", {
    get: function () { return sitMode !== 0; },
    configurable: true
  });
} catch (e) { }

window.__LC3D = {
  setView: debugSetView,
  setMode: setMode,
  state: getState,
  fps: getFps,
  screenshot: function () {
    try { return glCanvas.toDataURL("image/png"); } catch (e) { return ""; }
  }
};

/* ---- LCAndroid 契约模拟桥（供客户端轮 C 后对拍；不影响真桥） ---- */
window.__LCBridgeTest = (function () {
  var events = [], installed = false, prevBridge = null;

  function capture(json) {
    var evt = null, err = null;
    try { evt = JSON.parse(json); } catch (e) { err = "bad-json"; }
    events.push({ raw: json, evt: evt, err: err });
  }

  function install() {
    if (installed) return;
    prevBridge = window.LCAndroid;
    window.LCAndroid = { onEvent: capture };
    installed = true;
  }

  function uninstall() {
    if (!installed) return;
    if (prevBridge === undefined) { try { delete window.LCAndroid; } catch (e) { window.LCAndroid = undefined; } }
    else window.LCAndroid = prevBridge;
    installed = false;
  }

  function isNum(v) { return typeof v === "number" && isFinite(v); }

  function assertContract() {
    var fails = [];
    if (!events.length) fails.push("no events captured");
    for (var i = 0; i < events.length; i++) {
      var e = events[i];
      if (e.err) { fails.push("event# " + i + " bad json"); continue; }
      var ev = e.evt;
      if (!ev || typeof ev !== "object") { fails.push("event# " + i + " not object"); continue; }
      if (typeof ev.type !== "string") { fails.push("event# " + i + " missing type"); continue; }
      if (/NaN|Infinity/.test(e.raw)) fails.push("event# " + i + " non-finite serialized");
      if (ev.type === "pick") {
        if (!isNum(ev.lng) || ev.lng < -180 || ev.lng > 180) fails.push("pick#" + i + " lng");
        if (!isNum(ev.lat) || ev.lat < -90 || ev.lat > 90) fails.push("pick#" + i + " lat");
        if (!(ev.elev === null || isNum(ev.elev))) fails.push("pick#" + i + " elev must be number|null (missing=elev null, not 0)");
        if (!isNum(ev.heading) || ev.heading < 0 || ev.heading >= 360) fails.push("pick#" + i + " heading");
        if (ev.src !== "3d") fails.push("pick#" + i + " src");
      } else if (ev.type === "pick-clear") {
        /* 约定只有 type */
      } else {
        fails.push("event# " + i + " unknown type " + ev.type);
      }
    }
    return { pass: fails.length === 0, events: events.length, failures: fails };
  }

  function selfTest() {
    install();
    events = [];
    if (mode !== "3d" || !patch || !patch.mesh) {
      var r0 = { pass: false, failures: ["3d not ready"] };
      console.log("LCBRIDGE selfTest FAIL " + JSON.stringify(r0));
      uninstall();
      return r0;
    }
    var w = glCanvas.clientWidth, h = glCanvas.clientHeight;
    pick3D(w * 0.50, h * 0.62);
    pick3D(w * 0.42, h * 0.55);
    var markers = mapEl.querySelectorAll(".pick3d").length;
    clearMarkers();                       /* 应发 pick-clear */
    var r = assertContract();
    if (markers !== 1) r.failures.push("marker count " + markers + " != 1 (单点覆盖式)");
    var hasClear = false;
    for (var i = 0; i < events.length; i++) {
      if (events[i].evt && events[i].evt.type === "pick-clear") hasClear = true;
    }
    if (!hasClear) r.failures.push("no pick-clear after clearMarkers()");
    r.picks = events.filter(function (e) { return e.evt && e.evt.type === "pick"; }).length;
    r.markersAfterTwoPicks = markers;
    if (r.picks < 1) r.failures.push("no pick event emitted");
    r.pass = r.failures.length === 0;
    console.log("LCBRIDGE selfTest " + (r.pass ? "PASS" : "FAIL") + " " + JSON.stringify(r));
    uninstall();
    return r;
  }

  return {
    install: install, uninstall: uninstall,
    reset: function () { events = []; },
    events: function () { return events.slice(); },
    last: function (type) {
      for (var i = events.length - 1; i >= 0; i--) if (events[i].evt && events[i].evt.type === type) return events[i].evt;
      return null;
    },
    assertContract: assertContract,
    selfTest: selfTest
  };
})();

/* ---- 启动 ---- */
updateHud();
updateSrcInfo();
render();

/* 客户端入口：map.html#in3d → 直接进 3D（3D 桥对拍用，免去点按钮）
 * 可选：&lat=..&lng=..&z=..&pitch=..&bearing=..&contour&ground&sit
 * 页面初始化与 hashchange 都会应用，所以客户端一次 `loadUrl(...#in3d&sit)` 即可生效
 * （同文档导航只改 hash、不触发 onload 的情况也覆盖）。 */
function hashHas(h, name) {
  return new RegExp("(^#|&)" + name + "(&|=|$)").test(h || "");
}

function applyIn3D(hash) {
  var h = hash || location.hash || "";
  setTimeout(function () {
    if (!hashHas(h, "in3d")) return;
    var mlat = h.match(/lat=(-?[\d.]+)/), mlng = h.match(/lng=(-?[\d.]+)/);
    var mz = h.match(/[&#]z=(\d+)/), mp = h.match(/pitch=(\d+)/), mb = h.match(/bearing=(-?\d+)/);
    if (mode !== "3d") setMode("3d");
    if (mp) setPitch(parseInt(mp[1], 10));
    if (mb) { bearing = ((parseInt(mb[1], 10) % 360) + 360) % 360; refreshNeedle(); }
    if (mlat || mlng || mz) {
      debugSetView(mlat ? parseFloat(mlat[1]) : null, mlng ? parseFloat(mlng[1]) : null,
        mz ? parseInt(mz[1], 10) : null, null, null);
    }
    if (hashHas(h, "contour") && !contourOn) toggleContour();
    if (hashHas(h, "ground") && !groundMode) toggleGround();
    if (hashHas(h, "sit")) {
      var msit = h.match(/[&#]sit=(\d)/);
      var want = msit ? parseInt(msit[1], 10) : 1;   // sit=1 坐南朝北（默认），sit=0 坐北朝南
      setHeading(90);
      if (sitMode === 0) bearingBeforeSit = bearing;
      sitMode = (want === 1) ? 1 : 2;
      applySit();
    }
    if (hashHas(h, "srcpanel")) openSources();
    if (hashHas(h, "fs") && !fullScreen) toggleFullScreen();
    var msi = h.match(/src=(\d+)/);
    if (msi) selectSource(parseInt(msi[1], 10));
    console.log("LC3D in3d hash=" + h);
  }, 50);
}
if (hashHas(location.hash, "in3d")) applyIn3D();
window.addEventListener("hashchange", function () {
  if (hashHas(location.hash, "in3d")) applyIn3D(location.hash);
});

/* P0-4 AT 无头自检：map.html#at → 进 3D，等 DEM 就绪后跑 TD-001..TD-014，打 "LCAT ..." / "LCAT-RESULT" */
function runAT() {
  var R = [];
  function ok(id, cond, detail) {
    R.push((cond ? "PASS" : "FAIL") + " " + id + (detail ? " (" + detail + ")" : ""));
  }
  function markCount() { return mapEl.querySelectorAll(".pick3d").length; }
  __LCBridgeTest.install();
  __LCBridgeTest.reset();
  ok("TD-001", !!gl, "webgl");
  ok("TD-002", !!(patch && patch.mesh && patch.indexCount > 0), "patch");
  ok("TD-003", !!(patch && patch.tex), "texture");
  var w = glCanvas.clientWidth, h = glCanvas.clientHeight;
  pick3D(w * 0.50, h * 0.62);
  var e1 = __LCBridgeTest.last("pick");
  ok("TD-004", !!(e1 && e1.type === "pick" && e1.src === "3d"), "type/src");
  ok("TD-005", !!(e1 && isFinite(e1.lng) && e1.lng >= -180 && e1.lng <= 180 &&
    isFinite(e1.lat) && e1.lat >= -90 && e1.lat <= 90), "lng/lat range");
  ok("TD-006", !!(e1 && (e1.elev === null || typeof e1.elev === "number")), "elev " + (e1 && e1.elev));
  ok("TD-007", !!(e1 && isFinite(e1.heading) && e1.heading >= 0 && e1.heading < 360), "heading");
  setHeading(90);
  pick3D(w * 0.45, h * 0.55);
  var e2 = __LCBridgeTest.last("pick");
  ok("TD-008", !!(e2 && Math.abs(e2.heading - 90) < 0.11), "heading=90 got " + (e2 && e2.heading));
  ok("TD-009", markCount() === 1, "single marker " + markCount());
  var cc = __LCBridgeTest.assertContract();
  ok("TD-010", cc.pass, cc.pass ? "contract" : JSON.stringify(cc.failures));
  __LCBridgeTest.reset();
  clearMarkers();
  ok("TD-011", !!__LCBridgeTest.last("pick-clear"), "clear emits");
  __LCBridgeTest.reset();
  pick3D(w * 0.50, 3);
  ok("TD-012", __LCBridgeTest.last("pick") === null, "sky miss");
  __LCBridgeTest.reset();
  setMode("2d");
  clearMarkers();
  ok("TD-013", !!__LCBridgeTest.last("pick-clear"), "2d clear");
  __LCBridgeTest.uninstall();
  var thrown = false;
  try { pick3D(10, 10); } catch (e) { thrown = true; }
  ok("TD-014", !thrown && markCount() === 0, "no-bridge/no-marker");
  var api = ["setHeading", "setSitFace", "setBase", "setMode", "toggle3D", "setPitch",
    "rotateBearing", "setView", "zoomIn", "zoomOut", "locate", "clearMarkers",
    "getState", "getFps"];
  var missing = [];
  for (var ai = 0; ai < api.length; ai++) {
    if (typeof window[api[ai]] !== "function") missing.push(api[ai]);
  }
  if (typeof window.sitNorth !== "boolean") missing.push("sitNorth");
  ok("TD-015", missing.length === 0, missing.length ? ("missing:" + missing.join(",")) : "window api");
  var fails = 0;
  for (var i = 0; i < R.length; i++) if (R[i].indexOf("FAIL") === 0) fails++;
  console.log("LCAT " + R.join(" | "));
  console.log("LCAT-RESULT " + (fails === 0 ? "PASS" : "FAIL") + " total=" + R.length + " fails=" + fails);
}

if (hashHas(location.hash, "at") && !hashHas(location.hash, "selftest")) {
  setTimeout(function () {
    var h = location.hash;
    var mlat = h.match(/lat=(-?[\d.]+)/), mlng = h.match(/lng=(-?[\d.]+)/), mz = h.match(/[&#]z=(\d+)/);
    setMode("3d");
    if (mlat || mlng || mz) {
      debugSetView(mlat ? parseFloat(mlat[1]) : null, mlng ? parseFloat(mlng[1]) : null,
        mz ? parseInt(mz[1], 10) : null, null, null);
    }
    var tries = 0;
    var iv = setInterval(function () {
      if (patch && patch.mesh && patch.tex) { clearInterval(iv); setTimeout(runAT, 600); }
      else if (++tries > 80) { clearInterval(iv); console.log("LCAT TIMEOUT"); runAT(); }
    }, 500);
  }, 50);
}

/* 本地/无真机自测：map.html#selftest → 进 3D，等 DEM 就绪后在屏幕中心偏下做一次点选 */
if (hashHas(location.hash, "selftest")) {
  setTimeout(function () {
    setMode("3d");
    if (location.hash.indexOf("contour") >= 0) toggleContour();
    if (location.hash.indexOf("ground") >= 0) toggleGround();
    if (location.hash.indexOf("sit") >= 0) { setHeading(90); toggleSitNorth(); }
    if (location.hash.indexOf("noneedle") >= 0) toggleNeedle();
    /* 可复现视点：map.html#selftest&lat=40.0&lng=115.5&z=12 */
    var hh = location.hash;
    var mlat = hh.match(/lat=(-?[\d.]+)/), mlng = hh.match(/lng=(-?[\d.]+)/), mz = hh.match(/[&#]z=(\d+)/);
    if (mlat || mlng || mz) {
      debugSetView(mlat ? parseFloat(mlat[1]) : null, mlng ? parseFloat(mlng[1]) : null,
        mz ? parseInt(mz[1], 10) : null, null, null);
    }
  }, 100);
  setTimeout(function () {
    if (location.hash.indexOf("pitch0") >= 0) setPitch(0);
    if (mode !== "3d" || !patch) { console.log("LC3D selftest not-ready"); return; }
    if (location.hash.indexOf("bridge") >= 0) { window.__LCBridgeTest.selfTest(); return; }
    var w = glCanvas.clientWidth, h = glCanvas.clientHeight;
    pick3D(w / 2, h * 0.62);
  }, 12000);
}
