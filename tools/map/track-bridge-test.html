<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>F-15 track bridge test</title></head>
<body>
<!--
  F-15 轨迹回放桥无头测试（Chrome headless + 本地 http）。
  用法：仓库根目录起 `python -m http.server 8790`，打开
  http://127.0.0.1:8790/tools/map/track-bridge-test.html
  期望输出（控制台）：
    TR1 loaded=true seg=3 pts=600
    TR2 progress ... 
    TR3 play2x ... playing=false
    TR4 4x end ...
    TR5 clear loaded=false svg=0
    TR6 events track-loaded/track-tick/track-clear
-->
<iframe id="f" src="../../app/android/app/src/main/assets/map.html#in3d&lat=39.9&lng=116.4&z=11" width="400" height="800"></iframe>
<script>
function makeSeg(lat0, lng0, n, t0, stepMs) {
  var out = [];
  for (var i = 0; i < n; i++) {
    out.push({lat: lat0 + i * 0.0002, lng: lng0 + i * 0.0002, t: t0 + i * stepMs});
  }
  return out;
}
setTimeout(function () {
  var w = document.getElementById('f').contentWindow;
  try {
    w.__LCBridgeTest.install();
    var segs = [
      makeSeg(39.90, 116.40, 200, 1700000000000, 1000),
      makeSeg(39.95, 116.45, 200, 1700000300000, 1000),
      makeSeg(40.00, 116.50, 200, 1700000600000, 1000)
    ];
    var okLoad = w.lc_track_load(segs);
    var st1 = w.getState().track;
    console.log('TR1 loaded=' + st1.loaded + ' seg=' + st1.segments + ' pts=' + st1.points + ' t0=' + st1.t0 + ' t1=' + st1.t1);

    w.lc_track_progress(0.5);
    var st2 = w.getState().track;
    console.log('TR2 progress t=' + st2.t + ' inRange=' + (st2.t > st2.t0 && st2.t < st2.t1));
    var lines = w.document.querySelectorAll('#trackSvg polyline').length;
    var dots = w.document.querySelectorAll('#trackSvg circle').length;

    w.lc_track_play(2);
    setTimeout(function () {
      w.lc_track_pause();
      var st3 = w.getState().track;
      console.log('TR3 play2x t=' + st3.t + ' playing=' + st3.playing + ' advanced=' + (st3.t > st2.t) + ' lines=' + lines + ' dots=' + dots);

      /* 越界：给一个远超 t1 的时间，应被夹到 t1 */
      var t1 = w.getState().track.t1;
      w.lc_track_progress(t1 + 999999999);
      var st4 = w.getState().track;
      console.log('TR4 clamp t=' + st4.t + ' t1=' + st4.t1 + ' atEnd=' + (st4.t === st4.t1));
      /* 终点按播放：应从头开始（不越界、不空转） */
      w.lc_track_play(4);
      var st4b = w.getState().track;
      console.log('TR4b restart t=' + st4b.t + ' t0=' + st4b.t0 + ' atStart=' + (st4b.t === st4b.t0) + ' rate=' + st4b.rate);
      w.lc_track_pause();
      w.lc_track_clear();
      var st5 = w.getState().track;
      var svgKids = w.document.querySelectorAll('#trackSvg *').length;
      var ev = w.__LCBridgeTest.events().map(function (e) { return e.evt && e.evt.type; });
      console.log('TR5 clear loaded=' + st5.loaded + ' svg=' + svgKids);
      console.log('TR6 events=' + ev.join(','));
      console.log('TR7 loadReturned=' + okLoad);
    }, 900);
  } catch (e) { console.log('TRERR ' + e); }
}, 6000);
</script>
</body>
</html>
